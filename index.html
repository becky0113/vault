<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的網站清單</title>
<style>
  :root { --fg: #333; --muted: #666; --panel: #ffffff; --side: #ffffff; }
  body { font-family: system-ui, "Microsoft JhengHei", sans-serif; margin: 0; background: #fafafa; color: var(--fg); }
  header { color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #7c8db5; }
  header strong { font-size: 18px; }
  .hidden { display: none !important; }
  button { padding: 8px 12px; border: 0; border-radius: 8px; background: #7c8db5; color: #fff; cursor: pointer; margin: 2px; font-size: 14px; }
  button.gray { background: #9ca3af; }
  button.red { background: #e57373; }
  button.on { background: #4b5b80; }
  input, textarea, select { box-sizing: border-box; padding: 9px; margin: 4px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; color: #333; }
  input[type=text], input:not([type]), input[type=password], input[type=url], textarea { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; margin: 4px 0; word-break: break-all; }
  .panel { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .center { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 320px; max-width: 90vw; }
  .area { padding: 16px; }
  .over { outline: 2px dashed #7c8db5 !important; }
  .dragging { opacity: .4; }
  .handle { cursor: grab; user-select: none; padding: 0 4px; font-size: 16px; line-height: 1; opacity: .6; flex-shrink: 0; }
  .handle:active { cursor: grabbing; }

  /* 外框：左側分類 + 右側內容 */
  #shell { display: flex; min-height: calc(100vh - 52px); }
  aside { width: 190px; flex-shrink: 0; background: var(--side); padding: 12px; border-right: 1px solid rgba(127,127,127,.2); }
  aside h4 { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
  .cat-item { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; color: inherit; text-align: left; margin: 2px 0; padding: 8px 10px; }
  .cat-item.on { background: rgba(127,127,127,.2); }
  .cat-item .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); margin-right: 6px; vertical-align: middle; }
  main { flex: 1; padding: 16px; min-width: 0; }

  /* 分類面板 */
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; margin-top: 12px; }
  .panel-cat { border-radius: 14px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.05); }
  .panel-cat .ph { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .panel-cat .ph strong { font-size: 16px; color: #333; }
  .panel-cat .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: #333; }
  .panel-cat .tools input[type=color] { width: 36px; height: 28px; padding: 2px; margin: 0; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

  /* 網站卡片 */
  .item { border-radius: 12px; padding: 12px; color: #333; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item .top { display: flex; align-items: center; gap: 4px; }
  .item .info { min-width: 0; }
  .item .info strong { display: block; font-size: 16px; margin-bottom: 2px; }
  .item .muted { color: #555; word-break: normal; overflow-wrap: anywhere; margin: 2px 0; }
  .item .btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; margin-top: 4px; }
  .tbtn { background: rgba(255,255,255,.8); color: #333; border: 1px solid rgba(0,0,0,.08); padding: 6px 8px; font-size: 13px; }
  .tbtn:hover { background: #fff; }

  /* 罐頭語 */
  .snRow { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .snLabel { width: 140px; flex-shrink: 0; font-weight: bold; padding-top: 6px; word-break: break-all; }
  .snText { flex: 1; min-width: 0; cursor: pointer; padding: 6px 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .snText:hover { background: rgba(124,141,181,.2); }
  .snBtns { display: flex; flex-direction: column; gap: 4px; }

  /* 便籤 */
  .stCard { display: flex; gap: 8px; align-items: center; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); color: #333; }
  .stPrev { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }

  /* 記事本 */
  .nbWrap { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .nbList { width: 230px; flex-shrink: 0; }
  .nbItem { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 10px; cursor: pointer; background: var(--panel); margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .nbItem.on { outline: 2px solid #7c8db5; }
  .nbLabel { flex: 1; min-width: 0; word-break: break-all; }
  .nbEdit { flex: 1; min-width: 300px; background: var(--panel); border-radius: 14px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .nbEdit textarea { min-height: 220px; }
  .nbPasteBox { border: 2px dashed #9ca3af; border-radius: 10px; padding: 10px; text-align: center; color: #666; font-size: 13px; margin: 6px 0; }
  .nbImgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
  .imgWrap { display: flex; flex-direction: column; gap: 4px; }
  .imgWrap img { width: 100%; border-radius: 8px; cursor: zoom-in; display: block; background: #eee; min-height: 60px; }

  /* 放大檢視 */
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: flex; flex-direction: column; }
  .lbBar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 10px; background: rgba(0,0,0,.4); }
  .lbBar button { margin: 0; }
  #lbStage { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #lbImg { max-width: 90vw; max-height: 78vh; transition: transform .15s; user-select: none; background: #fff; border-radius: 6px; }

  /* 顏色選擇 */
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; margin: 0; cursor: pointer; }
  .swatch.on { border-color: #333; }
  #eColor, #bgColor, #hdColor { width: 60px; height: 36px; padding: 2px; margin: 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; display: none; z-index: 9; }

  /* 小視窗（便籤 / 罐頭語） */
  #miniView { display: none; flex-direction: column; gap: 8px; padding: 10px; min-height: 100vh; box-sizing: border-box; }
  body.mini #miniView { display: flex; }
  body.mini #loginView, body.mini #unlockView, body.mini #vaultView, body.mini #lightbox, body.mini #toast, body.mini header { display: none !important; }
  #miniSticky { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .mini-bar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .mini-bar button { margin: 0; }
  #msCard { flex: 1; display: flex; border-radius: 12px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  #msText { flex: 1; min-height: 240px; width: 100%; border: 0; background: transparent; resize: none; color: #333; padding: 4px; margin: 0; font-size: 16px; line-height: 1.5; }
  .msSn { border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .msSn:hover { outline: 2px solid #7c8db5; }
  .msSn .msTxt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; overflow: hidden; max-height: 3.2em; }
  .msSn:hover .msTxt { max-height: none; } /* 滑鼠移上去：卡片原地展開，不浮窗 */
  .msBtns { display: flex; gap: 4px; margin-top: 4px; }
  .msBtns button { margin: 0; padding: 4px 8px; font-size: 13px; }
  #msForm { background: rgba(255,255,255,.7); border-radius: 10px; padding: 8px; color: #333; }
  #msForm input, #msForm textarea { background: #fff; }
  #tipBox { position: fixed; z-index: 30; max-width: 360px; background: #222; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; box-shadow: 0 4px 12px rgba(0,0,0,.3); pointer-events: none; display: none; }

  @media (max-width: 700px) {
    #shell { flex-direction: column; }
    aside { width: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid rgba(127,127,127,.2); }
    aside h4 { width: 100%; }
    .cat-item { width: auto; }
    #panels { grid-template-columns: 1fr; }
    .snLabel { width: 90px; }
  }
</style>
</head>
<body>

<header id="hdr">
  <strong id="hdTitle">我的網站清單</strong>
  <button id="logoutBtn" class="gray hidden">登出</button>
</header>

<!-- 0. 小視窗（由 ?mini= 網址開啟） -->
<div id="miniView">
  <div id="msStatus" class="muted"></div>
  <div id="miniSticky" class="hidden">
    <div class="mini-bar">
      <button id="msSync">同步到主工具</button>
      <button id="msFontDn" class="gray">A－</button>
      <button id="msFontUp" class="gray">A＋</button>
      <button id="msColor" class="gray">換色</button>
      <button id="msNew" class="gray">＋ 新便籤</button>
      <button id="msDel" class="red">刪除</button>
    </div>
    <div id="msCard" style="background:#FFF5BA;">
      <textarea id="msText" placeholder="寫點什麼…（Ctrl+S 同步）"></textarea>
    </div>
  </div>
  <div id="miniSnip" class="hidden">
    <div class="mini-bar">
      <input id="msSearch" placeholder="搜尋罐頭語…" style="flex:1; width:auto; margin:0;">
      <button id="msAdd" class="gray">＋ 新增</button>
    </div>
    <div id="msForm" class="hidden">
      <input id="msLabel" placeholder="標籤（例如 稍候）">
      <textarea id="msBody" rows="3" placeholder="內容"></textarea>
      <div class="mini-bar">
        <button id="msFormSave">儲存並同步</button>
        <button id="msFormCancel" class="gray">取消</button>
      </div>
    </div>
    <div id="msList" style="margin-top:8px;"></div>
  </div>
</div>
<div id="tipBox"></div>

<!-- 1. 登入 -->
<section id="loginView" class="center">
  <div class="panel box">
    <h3>請用 Google 登入</h3>
    <button id="googleBtn">使用 Google 登入</button>
    <p id="loginMsg" class="muted"></p>
  </div>
</section>

<!-- 2. 輸入加密密碼 -->
<section id="unlockView" class="center hidden">
  <div class="panel box">
    <h3 id="unlockTitle">輸入加密密碼</h3>
    <p class="muted">這組密碼用來加密你的資料。忘記就無法解開，請妥善保存。</p>
    <input id="passphrase" type="password" placeholder="加密密碼">
    <button id="unlockBtn">解鎖</button>
    <p id="unlockMsg" class="muted"></p>
  </div>
</section>

<!-- 3. 主畫面 -->
<div id="vaultView" class="hidden" style="display:none;">
  <div class="row area" style="padding-bottom:0;">
    <button id="tabSites">網站清單</button>
    <button id="tabSnip" class="gray">罐頭語</button>
    <button id="tabSticky" class="gray">便籤</button>
    <button id="tabNote" class="gray">記事本</button>
  </div>

  <!-- 網站清單 -->
  <div id="shell">
    <aside>
      <h4>分類</h4>
      <div id="catList"></div>
    </aside>

    <main>
      <div class="row" style="justify-content: space-between;">
        <button id="openAllBtn">一鍵開啟全部網站</button>
        <button id="addBtn" class="gray">新增網站</button>
      </div>

      <input id="search" placeholder="搜尋名稱、網址、帳號、分類…" style="margin-top: 10px;">

      <div class="row muted" style="margin-top: 4px;">
        標題名稱：<input id="titleInput" placeholder="我的網站清單" style="width: 180px; margin: 0;">
        配色主題：
        <select id="themeSel"></select>
      </div>

      <div class="row muted" style="margin-top: 4px;">
        字體：
        <select id="fontSize">
          <option value="s">小</option>
          <option value="m">中</option>
          <option value="l">大</option>
        </select>
        頁面背景：<input id="bgColor" type="color" value="#fafafa">
        標題列顏色：<input id="hdColor" type="color" value="#7c8db5">
      </div>

      <div class="row" style="margin-top: 6px;">
        <button id="backupBtn" class="gray">下載加密備份</button>
        <label class="muted">還原備份：<input id="restoreFile" type="file" accept=".json" style="width: auto; border: 0; padding: 0;"></label>
      </div>

      <div id="editor" class="panel hidden" style="margin-top:14px;">
        <input id="eName" placeholder="名稱（例如 SH）">
        <input id="eCat" list="catOptions" placeholder="分類（選填，例如 平台 A）">
        <datalist id="catOptions"></datalist>
        <input id="eUrl" placeholder="網址（https://...）">
        <input id="eUser" placeholder="帳號">
        <input id="ePass" type="password" placeholder="密碼">
        <textarea id="eNote" rows="2" placeholder="備註（選填）"></textarea>

        <p class="muted">卡片顏色</p>
        <div class="row">
          <div id="swatches" class="row"></div>
          <label class="row muted">自選：<input id="eColor" type="color" value="#FFD6E0"></label>
          <label class="row muted">色碼：<input id="eHex" placeholder="#FFD6E0" maxlength="7" style="width: 110px; margin: 0;"></label>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="saveBtn">儲存</button>
          <button id="cancelBtn" class="gray">取消</button>
        </div>
        <p id="editMsg" class="muted"></p>
      </div>

      <div id="panels"></div>
    </main>
  </div>

  <!-- 罐頭語 -->
  <div id="snipArea" class="area hidden">
    <div class="panel">
      <input id="snLabel" placeholder="標籤（例如 稍候）">
      <textarea id="snText" rows="3" placeholder="內容（之後點一下就會複製）"></textarea>
      <div class="row">
        <button id="snSave">新增</button>
        <button id="snCancel" class="gray">取消</button>
        <span id="snMsg" class="muted"></span>
      </div>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <button id="snWin" class="gray">另開罐頭語小窗（點一下即可複製）</button>
    </div>
    <input id="snSearch" placeholder="搜尋罐頭語…">
    <div id="snList" style="margin-top:12px;"></div>
  </div>

  <!-- 便籤 -->
  <div id="stickyArea" class="area hidden">
    <div class="row"><button id="stAdd">＋ 新增便籤（開新小窗）</button></div>
    <p class="muted">每張便籤會開成獨立的小視窗；小窗內按「同步到主工具」才會更新這裡。拖曳 ⋮⋮ 可以調整順序。</p>
    <div id="stList" style="margin-top:12px;"></div>
  </div>

  <!-- 記事本 -->
  <div id="noteArea" class="area hidden">
    <div class="nbWrap">
      <div class="nbList">
        <button id="nbAdd" style="width:100%;">＋ 新增記事本</button>
        <div id="nbItems" style="margin-top:8px;"></div>
      </div>
      <div class="nbEdit" id="nbEdit">
        <p id="nbEmpty" class="muted">請先選擇或新增一則記事本。</p>
        <div id="nbLockedBox" class="hidden">
          <p>🔒 這則記事本已加密。</p>
          <button id="nbOpenBtn">輸入密碼解鎖</button>
        </div>
        <div id="nbForm" class="hidden">
          <input id="nbTitle" placeholder="標題">
          <textarea id="nbBody" placeholder="內容…"></textarea>
          <div class="nbPasteBox" id="nbPasteBox">點這裡，或在記事本任何地方按 Ctrl+V 貼上截圖</div>
          <div class="row">
            <button id="nbSave">儲存</button>
            <button id="nbLockBtn" class="gray">加密此記事本</button>
            <button id="nbUnlockBtn" class="gray hidden">解除加密</button>
            <button id="nbRelockBtn" class="gray hidden">再次鎖定</button>
            <button id="nbDelete" class="red">刪除這則記事本</button>
            <span id="nbMsg" class="muted"></span>
          </div>
          <div id="nbImgs" class="nbImgs"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="lightbox" class="hidden">
  <div class="lbBar">
    <button id="lbZoomIn">放大 ＋</button>
    <button id="lbZoomOut">縮小 －</button>
    <button id="lbReset" class="gray">還原</button>
    <button id="lbRotL" class="gray">左轉 ↺</button>
    <button id="lbRotR" class="gray">右轉 ↻</button>
    <button id="lbFlip" class="gray">鏡像 ⇆</button>
    <button id="lbClose" class="red">關閉 ✕</button>
  </div>
  <div id="lbStage"><img id="lbImg" alt=""></div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== 設定區 =====
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBZd0TJTOG-CVRmWCgGFV6Jiq3B3gNV3mk",
    authDomain: "ningzhao0918.firebaseapp.com",
    projectId: "ningzhao0918",
    appId: "1:329444672735:web:a743f288d61f6737e3956a"
  };
  const ALLOWED_EMAIL = "shee740113@gmail.com";
  // ====================================================================

  const THEMES = {
    "粉彩": { header: "#7c8db5", bg: "#fafafa", panel: "#ffffff",
      cards: ["#FFD6E0", "#FFE5B4", "#FFF5BA", "#C1F0D6", "#BDE0FE", "#D7C8F5", "#FFCFB3"] },
    "莫蘭迪": { header: "#8a9a8b", bg: "#f3f0ea", panel: "#ebe6df",
      cards: ["#C9B6A6", "#B8C4C2", "#D8C3B0", "#A7B1A8", "#CFC0BC", "#AEB8C7", "#E0D2C2"] },
    "星空": { header: "#1e2a4a", bg: "#0f1629", panel: "#1b2540",
      cards: ["#C7D2FE", "#DDD6FE", "#BAE6FD", "#A5F3FC", "#FBCFE8", "#E9D5FF", "#BFDBFE"] },
    "奶油": { header: "#c8a27a", bg: "#fff8ee", panel: "#fff1dc",
      cards: ["#FFE8C2", "#F9DCC4", "#FDF0D5", "#F6D6B8", "#EFE3C8", "#FBE7D1", "#E8D5B7"] },
    "海島": { header: "#0f8b8d", bg: "#e6f7f7", panel: "#d2f0ee",
      cards: ["#A8E6E6", "#9FD8F0", "#B5F0D8", "#FFE9A8", "#BFE9FF", "#CDEFE0", "#F7E7B5"] },
    "綠色療癒": { header: "#4f7f5f", bg: "#f2f7f1", panel: "#e2efe0",
      cards: ["#C8E6C9", "#DCEDC8", "#B2DFDB", "#E6F4D7", "#C5E1A5", "#D7EFD0", "#BFE8C8"] }
  };
  const ZOOM = { s: 0.9, m: 1, l: 1.2 };
  const NOCAT = "未分類";
  const DEFAULT_TITLE = "我的網站清單";
  const MAX_IMG_CHARS = 900000;

  // 小視窗模式：網址帶 ?mini=sticky&id=... 或 ?mini=snip
  const QS = new URLSearchParams(location.search);
  const MINI = QS.get("mini");
  const MINI_ID = QS.get("id");
  const BASE = location.origin + location.pathname;
  if (MINI) document.body.classList.add("mini");

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const bc = new BroadcastChannel("vault-sync");

  let user = null;
  let key = null;
  let salt = null;
  let items = [];
  let snippets = [];
  let notes = [];
  let settings = { bg: "#fafafa", font: "m", header: "#7c8db5", theme: "粉彩", title: DEFAULT_TITLE, catColors: {} };
  let editingId = null;
  let activeCat = null;
  let snEditId = null;
  let nbSelId = null;
  let area = "sites";
  let dragKind = null;
  let dragId = null;
  const imgCache = new Map();
  const openNotes = new Map(); // 已解鎖的加密記事本：id -> { key, title, body, images }

  // 小視窗用的狀態
  let lastState = null;
  let lastSig = "";

  let syncedBody = "";      // 便籤：上次已同步到主工具的內容
  let pendingBody = null;   // 便籤：送出中、等待主畫面回應的內容
  let pendingAck = null;    // 等待主畫面回應的項目 id

  const $ = id => document.getElementById(id);
  const textEnc = new TextEncoder();
  const textDec = new TextDecoder();
  // 分段转换，避免大图片超出浏览器参数数量上限（Maximum call stack size exceeded）
  const b64 = buf => {
    const bytes = new Uint8Array(buf);
    let s = "";
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(s);
  };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function show(view) {
    ["loginView", "unlockView", "vaultView"].forEach(v => $(v).classList.add("hidden"));
    $(view).classList.remove("hidden");

    $("logoutBtn").classList.toggle("hidden", view === "loginView");

  function toast(msg, ms = 1500) {
    const t = $("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => (t.style.display = "none"), ms);
  }

  // ===== 顏色工具 =====
  function isDark(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 0.299 * r + 0.587 * g + 0.114 * b < 140;
  }
  function theme() { return THEMES[settings.theme] || THEMES["粉彩"]; }
  function palette() { return theme().cards; }
  function nextStickyColor() {
    const cards = palette();
    const count = notes.filter(n => n.type === "sticky").length;
    return cards[count % cards.length];
  }

  // ===== 加密 =====
  async function deriveKey(pass, saltBytes) {
    const base = await crypto.subtle.importKey("raw", textEnc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: 310000, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function sealWith(k, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, textEnc.encode(text));
    return { iv: b64(iv), data: b64(ct) };
  }

  async function openWith(k, obj) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(obj.iv) }, k, unb64(obj.data));
    return textDec.decode(pt);
  }

  // 驗證加密密碼是否與登入工具的密碼相同
  async function verifyPass(pass) {
    const snap = await getDoc(doc(db, "vaults", user.uid));
    if (!snap.exists()) return false;
    const d = snap.data();
    try {
      const k = await deriveKey(pass, unb64(d.salt));
      await openWith(k, d);
      return true;
    } catch (e) {
      return false;
    }
  }

  function vaultPayload() {
    return { items, snippets, notes, settings };
  }

  // 目前狀態（給小視窗用）：不含加密記事本的內容
  function snapshot() {

      stickies: notes.filter(n => n.type === "sticky").map(n => ({ id: n.id, body: n.body || "", color: n.color })),
      snippets,
      settings,
      cards: palette(),
      dark: isDark(settings.bg || "#fafafa")
    };
  }

  function broadcast() {
    if (!MINI) bc.postMessage(snapshot());
  }

  async function saveVault() {
    broadcast();
    const sealed = await sealWith(key, JSON.stringify(vaultPayload()));
    await setDoc(doc(db, "vaults", user.uid), {
      salt: b64(salt),
      iv: sealed.iv,
      data: sealed.data,
      updated: Date.now()
    });
  }

  async function persist(msg) {
    try {
      await saveVault();
      if (msg) toast(msg);
    } catch (e) {
      toast("儲存失敗：" + e.message, 5000);
    }
  }

  // ===== 圖片 =====
  function compressImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("無法讀取圖片")); };
      img.src = url;
    });
  }

  // noteKey 有值 = 加密记事本的截图，用该记事本的钥匙加密
  async function addImage(blob, noteKey = null) {
    const dataUrl = await compressImage(blob);
    const sealed = await sealWith(noteKey || key, dataUrl);
    const size = sealed.data.length + sealed.iv.length;
    if (size > MAX_IMG_CHARS) throw new Error("圖片太大，請截小一點");
    const id = crypto.randomUUID();
    await setDoc(doc(db, "vaults", user.uid, "images", id), {
      ...sealed,
      created: Date.now(),
      ...(noteKey ? { nk: true } : {})
    });
    imgCache.set(id, dataUrl);
    return id;
  }

  async function getImage(id, noteKey = null) {
    if (imgCache.has(id)) return imgCache.get(id);
    const snap = await getDoc(doc(db, "vaults", user.uid, "images", id));
    if (!snap.exists()) return null;
    const d = snap.data();
    const k = d.nk ? noteKey : key;
    if (!k) return null;
    const url = await openWith(k, d);
    imgCache.set(id, url);
    return url;
  }

  async function removeImage(id) {
    await deleteDoc(doc(db, "vaults", user.uid, "images", id));
    imgCache.delete(id);
  }

  // ===== 解鎖 =====
  $("unlockBtn").onclick = async () => {
    const pass = $("passphrase").value;
    if (!pass) { $("unlockMsg").textContent = "請輸入加密密碼"; return; }
    try {
      const snap = await getDoc(doc(db, "vaults", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        salt = unb64(d.salt);
        key = await deriveKey(pass, salt);
        const p = JSON.parse(await openWith(key, d));
        if (Array.isArray(p)) {
          items = p;
        } else {
          items = p.items || [];
          snippets = p.snippets || [];
          notes = p.notes || [];
          const s = p.settings || {};
          settings = { ...settings, ...s, catColors: { ...(s.catColors || {}) } };
        }
      } else {
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await deriveKey(pass, salt);
        await saveVault();
      }
      applyAll();
      show("vaultView");
      showArea("sites");
      render();
    } catch (e) {

  $("backupBtn").onclick = async () => {

      const images = {};

      for (const d of snap.docs) {

        if (data.nk) {

        } else {
          images[d.id] = { nk: false, url: await openWith(key, data) };
        }
      }
      const sealed = await sealWith(key, JSON.stringify({ ...vaultPayload(), images }));
      const payload = { format: "vault-backup-v2", salt: b64(salt), iv: sealed.iv, data: sealed.data };
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "網站清單備份-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("備份已下載（請妥善保管）");

  $("restoreFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const pass = prompt("請輸入這份備份當時使用的加密密碼：");
    if (!pass) return;
    try {
      const d = JSON.parse(await file.text());
      const k = await deriveKey(pass, unb64(d.salt));
      const p = JSON.parse(await openWith(k, d));
      if (!confirm("還原會覆蓋目前的資料，確定要還原嗎？")) return;
      items = p.items || [];
      snippets = p.snippets || [];
      notes = p.notes || [];
      settings = { ...settings, ...(p.settings || {}) };
      for (const [id, img] of Object.entries(p.images || {})) {
        if (typeof img === "string") {
          // 旧版备份：直接是图片网址
          const sealed = await sealWith(key, img);
          await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now() });
          imgCache.set(id, img);
        } else if (img.nk) {
          await setDoc(doc(db, "vaults", user.uid, "images", id), { iv: img.iv, data: img.data, nk: true, created: Date.now() });
        } else {
          const sealed = await sealWith(key, img.url);
          await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now() });
          imgCache.set(id, img.url);
        }
      }
      applyAll();
      await persist("已還原");
      render();

  // ===== 拖曳排序（⋮⋮ 把手） =====
  function makeHandle(title = "拖曳排序") {

  // 只有按住把手時才允許拖曳，避免影響卡片上的按鈕與文字選取
  function bindDrag(row, handle, kind, id, onDrop) {
    handle.addEventListener("mousedown", () => {
      row.draggable = true;
      const off = () => {
        row.draggable = false;
        document.removeEventListener("mouseup", off);
      };
      document.addEventListener("mouseup", off);
    });
    row.addEventListener("dragstart", e => {
      dragKind = kind;
      dragId = id;
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", id);
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => {
      row.draggable = false;
      row.classList.remove("dragging");
      dragKind = null;
      dragId = null;
      document.querySelectorAll(".over").forEach(x => x.classList.remove("over"));
    });
    row.addEventListener("dragover", e => {
      if (dragKind !== kind) return;
      e.preventDefault();
      row.classList.add("over");
    });
    row.addEventListener("dragleave", () => row.classList.remove("over"));
    row.addEventListener("drop", e => {
      if (dragKind !== kind) return;
      e.preventDefault();
      row.classList.remove("over");
      const from = dragId;
      if (from && from !== id) onDrop(from, id);
    });
  }

  // 把 fromId 移到 toId 的位置（移到目標之前）
  function moveInList(arr, fromId, toId) {
    const i = arr.findIndex(x => x.id === fromId);
    if (i < 0) return false;
    const [m] = arr.splice(i, 1);
    const j = arr.findIndex(x => x.id === toId);
    if (j < 0) { arr.splice(i, 0, m); return false; }
    arr.splice(j, 0, m);
    return true;
  }

  async function moveItem(fromId, toId) {
    const from = items.find(x => x.id === fromId);
    const to = items.find(x => x.id === toId);
    if (!from || !to) return;
    from.category = to.category || "";
    moveInList(items, fromId, toId);
    await persist();
    render();
  }

  function catOf(it) { return it.category || NOCAT; }
  function catColor(c) { return (settings.catColors || {})[c] || theme().panel; }

  function renderSidebar() {
    const box = $("catList");
    box.textContent = "";
    const counts = new Map();
    items.forEach(it => counts.set(catOf(it), (counts.get(catOf(it)) || 0) + 1));

    const addBtn = (label, count, value, color) => {
      const b = document.createElement("button");
      b.className = "cat-item" + (activeCat === value ? " on" : "");
      const left = document.createElement("span");
      if (color) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = color;
        left.appendChild(dot);
      }
      left.appendChild(document.createTextNode(label));
      const right = document.createElement("span");
      right.style.opacity = "0.7";
      right.textContent = count;
      b.appendChild(left);
      b.appendChild(right);
      b.onclick = () => { activeCat = value; render(); };
      box.appendChild(b);
    };

    addBtn("全部", items.length, null, null);
    counts.forEach((n, c) => addBtn(c, n, c, catColor(c)));
  }

  // ===== 網站主畫面 =====
  function render() {
    renderSidebar();
    const panels = $("panels");
    panels.textContent = "";

    if (!items.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "還沒有網站，按「新增網站」開始。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const q = $("search").value.trim().toLowerCase();
    const searching = q !== "";
    const visible = items.filter(it =>
      (!activeCat || catOf(it) === activeCat) &&
      (!searching || [it.name, it.url, it.username, it.note || "", it.category || ""].some(s => s.toLowerCase().includes(q)))
    );

    if (!visible.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "找不到符合的網站。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const groups = new Map();
    visible.forEach(it => {
      const c = catOf(it);
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(it);
    });

    groups.forEach((arr, cat) => panels.appendChild(catPanel(cat, arr, !searching)));
    renderCatOptions();
  }

  function itemRow(it, canReorder) {
    const row = document.createElement("div");

    const name = document.createElement("strong");

  function renderCatOptions() {

      const o = document.createElement("option");

  // ===== 顏色選擇 =====
  function setColor(c) {
    $("eColor").value = c;
    if (document.activeElement !== $("eHex")) $("eHex").value = c.toUpperCase();
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.color.toLowerCase() === c.toLowerCase()));
  }

  function buildSwatches() {
    const box = $("swatches");
    box.textContent = "";
    palette().forEach(c => {
      const s = document.createElement("button");
      s.className = "swatch";
      s.dataset.color = c;
      s.style.background = c;
      s.title = c;
      s.onclick = e => { e.preventDefault(); setColor(c); };
      box.appendChild(s);
    });

  $("eColor").addEventListener("input", e => setColor(e.target.value));

  $("eHex").addEventListener("input", e => {
    let v = e.target.value.trim();
    if (v && !v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      $("editMsg").textContent = "";
      setColor(v);
    } else if (v.length >= 7) {
      $("editMsg").textContent = "色碼格式不正確，要 6 位數，例如 #215487";
    }
  });

  // ===== 網站編輯 =====
  function openEditor(it = null) {
    editingId = it ? it.id : null;
    $("eName").value = it ? it.name : "";
    $("eCat").value = it ? (it.category || "") : (activeCat && activeCat !== NOCAT ? activeCat : "");
    $("eUrl").value = it ? it.url : "";
    $("eUser").value = it ? it.username : "";
    $("ePass").value = it ? it.password : "";
    $("eNote").value = it ? (it.note || "") : "";
    $("editMsg").textContent = "";
    renderCatOptions();
    buildSwatches();
    setColor(it && it.color ? it.color : palette()[0]);
    $("editor").classList.remove("hidden");
    $("editor").scrollIntoView({ behavior: "smooth" });
  }

  function closeEditor() {
    $("editor").classList.add("hidden");
    editingId = null;
  }

  $("addBtn").onclick = () => openEditor();
  $("cancelBtn").onclick = closeEditor;

  $("saveBtn").onclick = async () => {
    const data = {
      name: $("eName").value.trim(),
      category: $("eCat").value.trim(),
      url: $("eUrl").value.trim(),
      username: $("eUser").value,
      password: $("ePass").value,
      note: $("eNote").value.trim(),
      color: $("eColor").value
    };
    if (!data.name) { $("editMsg").textContent = "請輸入名稱"; return; }
    if (!/^https?:\/\//.test(data.url)) { $("editMsg").textContent = "網址要以 https:// 開頭"; return; }

    if (editingId) {
      items = items.map(x => (x.id === editingId ? { ...x, ...data } : x));
    } else {
      items.push({ id: crypto.randomUUID(), ...data });
    }
    try {
      await saveVault();
      closeEditor();
      render();
      toast("已儲存");
    } catch (e) {
      $("editMsg").textContent = "儲存失敗：" + e.message;
    }
  };

  async function removeItem(id) {
    if (!confirm("確定要刪除這個網站嗎？")) return;
    items = items.filter(x => x.id !== id);
    await persist();
    render();
  }

  // ===== 放大檢視（頁面內，不另開分頁） =====
  const lb = { zoom: 1, rot: 0, flip: false };

  function applyLb() {
    $("lbImg").style.transform = `scale(${lb.zoom}) rotate(${lb.rot}deg) scaleX(${lb.flip ? -1 : 1})`;
  }

  function resetLb() {
    lb.zoom = 1; lb.rot = 0; lb.flip = false;
    applyLb();
  }

  function openLightbox(src) {
    $("lbImg").src = src;
    resetLb();
    $("lightbox").classList.remove("hidden");
  }

  function closeLightbox() {
    $("lightbox").classList.add("hidden");
    $("lbImg").src = "";
  }

  function zoomBy(d) {
    lb.zoom = Math.min(5, Math.max(0.25, +(lb.zoom + d).toFixed(2)));
    applyLb();
  }

  $("lbZoomIn").onclick = () => zoomBy(0.25);
  $("lbZoomOut").onclick = () => zoomBy(-0.25);
  $("lbReset").onclick = resetLb;
  $("lbRotL").onclick = () => { lb.rot -= 90; applyLb(); };
  $("lbRotR").onclick = () => { lb.rot += 90; applyLb(); };
  $("lbFlip").onclick = () => { lb.flip = !lb.flip; applyLb(); };
  $("lbClose").onclick = closeLightbox;
  $("lbStage").addEventListener("click", e => { if (e.target.id === "lbStage") closeLightbox(); });
  $("lbStage").addEventListener("wheel", e => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 0.1 : -0.1);
  }, { passive: false });

  document.addEventListener("keydown", e => {
    if ($("lightbox").classList.contains("hidden")) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "+" || e.key === "=") zoomBy(0.25);
    else if (e.key === "-") zoomBy(-0.25);
    else if (e.key === "ArrowLeft") { lb.rot -= 90; applyLb(); }
    else if (e.key === "ArrowRight") { lb.rot += 90; applyLb(); }
  });

  // ===== 罐頭語 =====
  function renderSnippets() {
    const list = $("snList");
    list.textContent = "";
    const q = $("snSearch").value.trim().toLowerCase();
    const shown = snippets.filter(s => !q || s.label.toLowerCase().includes(q) || s.text.toLowerCase().includes(q));
    if (!shown.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = snippets.length ? "找不到符合的罐頭語。" : "還沒有罐頭語，請在上方新增。";
      list.appendChild(p);
      return;
    }
    shown.forEach(s => {
      const row = document.createElement("div");
      row.className = "snRow";

      if (!q) {
        const h = makeHandle();
        row.appendChild(h);
        bindDrag(row, h, "snip", s.id, (f, t) => {
          if (moveInList(snippets, f, t)) { persist(); renderSnippets(); }
        });
      }

      const label = document.createElement("div");
      label.className = "snLabel";
      label.textContent = s.label;

      const text = document.createElement("div");
      text.className = "snText";
      text.textContent = s.text;
      text.title = "點一下複製內容";
      text.onclick = () => copy(s.text);

      const btns = document.createElement("div");
      btns.className = "snBtns";
      btns.appendChild(tbtn("編輯", () => editSnippet(s)));
      btns.appendChild(tbtn("刪除", () => removeSnippet(s.id), "red"));

      row.append(label, text, btns);
      list.appendChild(row);
    });
  }

  function resetSnForm() {
    snEditId = null;
    $("snLabel").value = "";
    $("snText").value = "";
    $("snSave").textContent = "新增";
    $("snMsg").textContent = "";

  function editSnippet(s) {

    $("snSave").textContent = "儲存";

  async function removeSnippet(id) {
    if (!confirm("確定要刪除這則罐頭語嗎？")) return;

    await persist();

  $("snSave").onclick = async () => {
    const label = $("snLabel").value.trim();

    } else {
      snippets.push({ id: crypto.randomUUID(), label, text });

    await persist("罐頭語已儲存");

  $("snCancel").onclick = resetSnForm;
  $("snSearch").addEventListener("input", renderSnippets);
  $("snWin").onclick = () => window.open(BASE + "?mini=snip", "vault-snip", "width=380,height=600");

  // ===== 便籤（每張便籤 = 一個小視窗） =====
  function openStickyWin(id) {
    window.open(BASE + "?mini=sticky&id=" + encodeURIComponent(id), "vault-sticky-" + id, "width=320,height=340");
  }

  function renderStickies() {
    const list = $("stList");
    list.textContent = "";
    const stickies = notes.filter(n => n.type === "sticky");
    if (!stickies.length) {

      });

      prev.className = "stPrev";

      btns.className = "row";

      btns.appendChild(tbtn("換色", async () => {

        await persist();
        renderStickies();
      }));

  $("stAdd").onclick = async () => {
    const id = crypto.randomUUID();
    openStickyWin(id); // 要在點擊當下開視窗，否則會被瀏覽器擋掉
    notes.push({ id, type: "sticky", title: "", body: "", images: [], color: nextStickyColor(), updated: Date.now() });
    await persist();
    renderStickies();
  };

  // 接收小視窗傳來的要求（只有主畫面會處理），處理完回傳 ack
  async function onPopupMsg(m) {
    if (!key || !user) return;
    try {
      if (m.type === "stickyBody") {
        const n = notes.find(x => x.id === m.id && x.type === "sticky");
        if (!n) return;
        n.body = m.body;
        n.updated = Date.now();
        await saveVault();
        if (area === "sticky") renderStickies();
      } else if (m.type === "stickyColor") {
        const n = notes.find(x => x.id === m.id && x.type === "sticky");
        if (!n) return;
        const cards = palette();
        n.color = cards[(cards.indexOf(n.color) + 1) % cards.length];
        await saveVault();
        renderStickies();
      } else if (m.type === "stickyCreate") {
        if (!notes.some(x => x.id === m.id)) {
          notes.push({ id: m.id, type: "sticky", title: "", body: "", images: [], color: nextStickyColor(), updated: Date.now() });
        }
        await saveVault();
        renderStickies();
      } else if (m.type === "stickyDelete") {
        notes = notes.filter(x => !(x.id === m.id && x.type === "sticky"));
        await saveVault();
        renderStickies();
      } else if (m.type === "snipUpsert") {
        const s = m.snip;
        const i = snippets.findIndex(x => x.id === s.id);
        if (i >= 0) snippets[i] = { ...snippets[i], label: s.label, text: s.text };
        else snippets.push({ id: s.id, label: s.label, text: s.text });
        await saveVault();
        if (area === "snip") renderSnippets();
      } else if (m.type === "snipDelete") {
        snippets = snippets.filter(x => x.id !== m.id);
        await saveVault();
        if (area === "snip") renderSnippets();
      } else {
        return;
      }
      bc.postMessage({ type: "ack", id: m.id === undefined ? m.snip && m.snip.id : m.id });
    } catch (e) {
      toast("同步失敗：" + e.message, 5000);
    }
  }

  // ===== 記事本 =====
  function currentNote() {
    return notes.find(n => n.id === nbSelId && n.type === "notebook") || null;
  }

  // 目前可用的內容：加密的記事本需要已解鎖（openNotes 有資料）
  function nbView(note) {
    if (note.locked) {
      const o = openNotes.get(note.id);
      return o ? { title: o.title, body: o.body, images: o.images, key: o.key } : null;
    }
    return { title: note.title || "", body: note.body || "", images: note.images || [], key: null };
  }

  function nbImages(note) {
    if (note.locked) return openNotes.get(note.id).images;
    note.images = note.images || [];
    return note.images;
  }

  // 儲存記事本：加密的記事本會重新加密內容
  async function commitNote(note) {
    note.updated = Date.now();
    if (note.locked) {
      const o = openNotes.get(note.id);
      if (!o) return;
      note.sealed = await sealWith(o.key, JSON.stringify({ body: o.body, images: o.images }));
    }
    await persist();
  }

  // 鎖回加密記事本：清除記憶體中的明文
  function relockNote(id) {
    const o = openNotes.get(id);
    if (o) o.images.forEach(i => imgCache.delete(i));
    openNotes.delete(id);
  }

  function renderNotebook() {
    const box = $("nbItems");
    box.textContent = "";
    const books = notes.filter(n => n.type === "notebook");
    books.forEach(n => {
      const it = document.createElement("div");
      it.className = "nbItem" + (n.id === nbSelId ? " on" : "");
      const h = makeHandle();
      const label = document.createElement("span");
      label.className = "nbLabel";
      if (n.locked) {
        label.textContent = "🔒 " + (n.title || "未命名");
      } else {
        label.textContent = n.title || "未命名";
      }
      it.append(h, label);
      it.onclick = () => {
        if (nbSelId && nbSelId !== n.id) relockNote(nbSelId);
        nbSelId = n.id;
        renderNotebook();
      };
      bindDrag(it, h, "nb", n.id, (f, t) => {
        if (moveInList(notes, f, t)) { persist(); renderNotebook(); }
      });
      box.appendChild(it);
    });

    const note = currentNote();
    const view = note ? nbView(note) : null;
    $("nbEmpty").classList.toggle("hidden", !!note);
    $("nbLockedBox").classList.toggle("hidden", !(note && note.locked && !view));
    $("nbForm").classList.toggle("hidden", !(note && view));
    if (!note || !view) return;

    $("nbTitle").value = view.title || "";
    $("nbBody").value = view.body || "";
    $("nbLockBtn").classList.toggle("hidden", !!note.locked);
    $("nbUnlockBtn").classList.toggle("hidden", !note.locked);
    $("nbRelockBtn").classList.toggle("hidden", !note.locked);
    renderNbImages(note);
  }

  $("nbAdd").onclick = async () => {
    if (nbSelId) relockNote(nbSelId);
    const n = { id: crypto.randomUUID(), type: "notebook", title: "未命名", body: "", images: [], updated: Date.now() };
    notes.unshift(n);
    nbSelId = n.id;
    await persist();
    renderNotebook();
  };

  $("nbSave").onclick = async () => {
    const note = currentNote();
    if (!note || !nbView(note)) return;
    const title = $("nbTitle").value.trim() || "未命名";
    const body = $("nbBody").value;
    note.title = title; // 標題永遠明文顯示，只有內容加密
    if (note.locked) {
      const o = openNotes.get(note.id);
      o.title = title;
      o.body = body;
    } else {
      note.title = title;
      note.body = body;
    }
    await commitNote(note);
    toast("記事本已儲存");
    renderNotebook();
  };

  // 加密此記事本：驗證密碼 → 截圖與內容改用專屬钥匙加密
  $("nbLockBtn").onclick = async () => {
    const note = currentNote();
    if (!note || note.locked) return;
    const pass = prompt("請輸入加密密碼（與登入工具的密碼相同），用來加密這則記事本：");
    if (!pass) return;
    if (!(await verifyPass(pass))) { toast("密碼不正確"); return; }
    try {
      const title = $("nbTitle").value.trim() || note.title || "未命名";
      const body = $("nbBody").value || note.body || "";
      const images = [...(note.images || [])];
      const saltBytes = crypto.getRandomValues(new Uint8Array(16));
      const nk = await deriveKey(pass, saltBytes);
      for (const id of images) {
        const url = await getImage(id, null);
        if (!url) continue;
        const sealed = await sealWith(nk, url);
        await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now(), nk: true });
        imgCache.delete(id);
      }
      note.salt = b64(saltBytes);
      note.title = title;
      note.sealed = await sealWith(nk, JSON.stringify({ body, images }));
      note.locked = true;
      delete note.body;
      delete note.images;
      openNotes.set(note.id, { key: nk, title, body, images });
      note.updated = Date.now();
      await persist("已加密此記事本");
      renderNotebook();
    } catch (e) {
      toast("加密失敗：" + e.message, 5000);
    }
  };

  // 解鎖加密的記事本
  async function openLockedNote(note) {
    if (!note || !note.locked) return;
    const pass = prompt("請輸入這則記事本的加密密碼（與登入工具的密碼相同）：");
    if (!pass) return;
    try {
      const nk = await deriveKey(pass, unb64(note.salt));
      const p = JSON.parse(await openWith(nk, note.sealed));
      openNotes.set(note.id, { key: nk, title: note.title || p.title || "", body: p.body || "", images: p.images || [] });
      // 舊版加密的記事本：標題補成明文，並以新格式重新加密
      if (!note.title && p.title) {
        note.title = p.title;
        await commitNote(note);
      }
      renderNotebook();
    } catch (e) {
      toast("密碼不正確");
    }
  }

  $("nbOpenBtn").onclick = () => openLockedNote(currentNote());

  // 解除加密：改回一般儲存方式
  $("nbUnlockBtn").onclick = async () => {
    const note = currentNote();
    const o = note && openNotes.get(note.id);
    if (!o) return;
    if (!confirm("解除加密後，這則記事本會改為一般方式儲存。確定要解除嗎？")) return;
    try {
      for (const id of o.images) {
        const url = await getImage(id, o.key);
        if (!url) continue;
        const sealed = await sealWith(key, url);
        await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now() });
        imgCache.set(id, url);
      }
      note.title = o.title;
      note.body = o.body;
      note.images = [...o.images];
      delete note.salt;
      delete note.sealed;
      note.locked = false;
      openNotes.delete(note.id);
      await commitNote(note);
      toast("已解除加密");
      renderNotebook();
    } catch (e) {
      toast("解除加密失敗：" + e.message, 5000);
    }
  };

  $("nbRelockBtn").onclick = () => {
    const note = currentNote();
    if (note) relockNote(note.id);
    renderNotebook();
  };

  $("nbDelete").onclick = async () => {
    const note = currentNote();
    if (!note) return;
    if (note.locked && !openNotes.has(note.id)) { toast("請先解鎖才能刪除"); return; }
    if (!confirm("確定要刪除這則記事本（包含所有截圖）嗎？")) return;
    const ids = note.locked ? [...openNotes.get(note.id).images] : [...(note.images || [])];
    for (const id of ids) {
      try { await removeImage(id); } catch (e) {}
    }
    relockNote(note.id);
    notes = notes.filter(n => n.id !== note.id);
    nbSelId = null;
    await persist("已刪除");
    renderNotebook();
  };

  // 在記事本分頁按 Ctrl+V 貼上截圖
  async function pasteImages(e) {
    if (area !== "note") return;
    const files = [...(e.clipboardData ? e.clipboardData.items : [])]
      .filter(i => i.type.startsWith("image/"))
      .map(i => i.getAsFile());
    if (!files.length) return;
    e.preventDefault();
    const note = currentNote();
    if (!note) { toast("請先選擇或新增一則記事本"); return; }
    const view = nbView(note);
    if (!view) { toast("請先解鎖這則記事本"); return; }
    toast("圖片加入中，請稍候…");
    $("nbMsg").textContent = "圖片處理中…";
    let failed = 0;
    for (const f of files) {
      try {
        const id = await addImage(f, view.key);
        nbImages(note).push(id);
      } catch (err) {
        failed++;
        toast("圖片加入失敗：" + err.message, 6000);
      }
    }
    await commitNote(note);
    if (failed === 0) toast("圖片已加入");
    $("nbMsg").textContent = "";
    renderNbImages(note);
  }

  document.addEventListener("paste", e => {
    if (area !== "note") return;
    pasteImages(e);
  });

  $("nbPasteBox").addEventListener("click", () => $("nbBody").focus());

  function renderNbImages(note) {
    const box = $("nbImgs");
    box.textContent = "";
    const view = nbView(note);
    if (!view) return;
    const ids = view.images || [];
    $("nbMsg").textContent = ids.length ? "共 " + ids.length + " 張截圖" : "";
    ids.forEach((id, i) => {
      const wrap = document.createElement("div");
      wrap.className = "imgWrap";

      const img = document.createElement("img");
      img.alt = "截圖 " + (i + 1);
      img.title = "點一下放大";
      img.onclick = () => { if (img.src) openLightbox(img.src); };
      const cap = document.createElement("div");
      cap.className = "muted";
      cap.textContent = "截圖 " + (i + 1) + " 載入中…";

      const cached = imgCache.get(id);
      if (cached) {
        img.src = cached;
        cap.textContent = "截圖 " + (i + 1);
      } else {
        getImage(id, view.key)
          .then(u => {
            if (u) { img.src = u; cap.textContent = "截圖 " + (i + 1); }
            else cap.textContent = "找不到這張圖片（可能已被刪除）";
          })
          .catch(err => { cap.textContent = "無法載入：" + err.message; });
      }

      const del = smallBtn("刪除這張圖", async () => {
        if (!confirm("確定要刪除這張圖片嗎？")) return;
        const list = nbImages(note);
        const idx = list.indexOf(id);
        if (idx >= 0) list.splice(idx, 1);
        try { await removeImage(id); } catch (e) {}
        await commitNote(note);
        renderNbImages(note);
      }, "red");

      wrap.append(img, cap, del);
      box.appendChild(wrap);
    });
  }

  // ===== 小視窗（便籤 / 罐頭語）的程式 =====
  function miniStatus(t) {
    $("msStatus").textContent = t;
  }

  function applyMiniTheme(s) {
    const bg = (s.settings && s.settings.bg) || "#fafafa";
    document.body.style.background = bg;
    document.body.style.color = s.dark ? "#e5e7eb" : "#333";
  }

  // 送出給主畫面；若一段時間沒有回應就提醒
  function sendToMain(msg) {
    bc.postMessage(msg);
    pendingAck = msg.id === undefined ? msg.snip.id : msg.id;
    const waitId = pendingAck;
    miniStatus("同步中…");
    setTimeout(() => {
      if (pendingAck === waitId) {
        pendingAck = null;
        miniStatus("未收到主畫面回應，請確認主畫面已開啟並解鎖");
      }
    }, 2500);
  }

  // ----- 罐頭語小窗 -----
  function renderMiniSnip() {
    const s = lastState;
    if (!s) return;
    const list = $("msList");
    list.textContent = "";
    const q = $("msSearch").value.trim().toLowerCase();
    const all = s.snippets || [];
    const shown = all.filter(x => !q || x.label.toLowerCase().includes(q) || x.text.toLowerCase().includes(q));
    if (!shown.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = all.length ? "找不到符合的罐頭語。" : "還沒有罐頭語，請按上方「＋ 新增」。";
      list.appendChild(p);
      return;
    }
    shown.forEach((x, i) => {
      const d = document.createElement("div");
      d.className = "msSn";
      d.style.background = s.cards[i % s.cards.length];

      const l = document.createElement("strong");
      l.textContent = x.label;
      const t = document.createElement("div");
      t.className = "msTxt";
      t.textContent = x.text;

      const bt = document.createElement("div");
      bt.className = "msBtns";
      const ed = document.createElement("button");
      ed.className = "gray";
      ed.textContent = "編輯";
      ed.onclick = e => { e.stopPropagation(); openMiniForm(x); };
      const del = document.createElement("button");
      del.className = "red";
      del.textContent = "刪除";
      del.onclick = e => {
        e.stopPropagation();
        if (!confirm("確定要刪除這則罐頭語嗎？\n「" + x.label + "」")) return;
        sendToMain({ type: "snipDelete", id: x.id });
      };
      bt.append(ed, del);

      d.append(l, t, bt);
      // 點卡片本體：複製（不變）
      d.onclick = async () => {
        await navigator.clipboard.writeText(x.text);
        miniStatus("已複製：" + x.label);
      };
      list.appendChild(d);
    });
  }

  function openMiniForm(s = null) {
    $("msForm").dataset.id = s ? s.id : "";
    $("msLabel").value = s ? s.label : "";
    $("msBody").value = s ? s.text : "";
    $("msForm").classList.remove("hidden");
    $("msLabel").focus();
  }

  function closeMiniForm() {
    $("msForm").classList.add("hidden");
    $("msForm").dataset.id = "";
  }

  $("msAdd").onclick = () => openMiniForm(null);
  $("msFormCancel").onclick = closeMiniForm;
  $("msFormSave").onclick = () => {
    const label = $("msLabel").value.trim();
    const text = $("msBody").value.trim();
    if (!label) { miniStatus("請輸入標籤"); return; }
    if (!text) { miniStatus("請輸入內容"); return; }
    const id = $("msForm").dataset.id || crypto.randomUUID();
    sendToMain({ type: "snipUpsert", snip: { id, label, text } });
    closeMiniForm();
  };
  $("msSearch").addEventListener("input", renderMiniSnip);

  // ----- 便籤小窗 -----
  const FONT_KEY = "vault-sticky-font";
  let stickyFont = 16;
  try { stickyFont = +localStorage.getItem(FONT_KEY) || 16; } catch (e) {}

  function setStickyFont(px) {
    stickyFont = Math.max(12, Math.min(40, px));
    $("msText").style.fontSize = stickyFont + "px";
    try { localStorage.setItem(FONT_KEY, String(stickyFont)); } catch (e) {}
  }

  function stickyDirty() {
    return $("msText").value !== syncedBody;
  }

  function refreshStickyStatus() {
    if (pendingAck) return;
    miniStatus(stickyDirty() ? "未同步：按「同步到主工具」才會更新主工具" : "已同步");
  }

  function syncSticky() {
    if (!MINI_ID) return;
    pendingBody = $("msText").value;
    sendToMain({ type: "stickyBody", id: MINI_ID, body: pendingBody });
  }

  function onAck(id) {
    if (id !== pendingAck) return;
    pendingAck = null;
    if (MINI === "sticky") {
      if (pendingBody !== null) syncedBody = pendingBody;
      pendingBody = null;
      refreshStickyStatus();
    } else {
      miniStatus("已同步到主工具");
    }
  }

  function onMiniState(s) {
    lastStateAt = Date.now();
    applyMiniTheme(s);
    const sig = JSON.stringify(s);
    if (sig === lastSig) return;
    lastSig = sig;
    lastState = s;

    if (MINI === "snip") {
      renderMiniSnip();
      if (!pendingAck) miniStatus(s.ready ? "點一下即可複製" : "請先在主畫面解鎖");
      return;
    }
    if (!s.ready) {
      miniStatus("請先在主畫面解鎖");
      $("msText").disabled = true;
      return;
    }
    const n = s.stickies.find(x => x.id === MINI_ID);
    if (!n) {
      miniStatus("這張便籤已不存在");
      $("msText").disabled = true;
      return;
    }
    $("msText").disabled = false;
    $("msCard").style.background = n.color || s.cards[0];
    if (!miniLoaded) {
      $("msText").value = n.body;
      syncedBody = n.body;
      miniLoaded = true;
      refreshStickyStatus();
    }
  }

  // 關窗前若還有未同步的內容，跳出提醒
  window.addEventListener("beforeunload", e => {
    if (MINI === "sticky" && miniLoaded && stickyDirty()) {
      e.preventDefault();
      e.returnValue = "";
    }
  });

  bc.onmessage = e => {
    const m = e.data || {};
    if (MINI) {
      if (m.type === "state") onMiniState(m);
      else if (m.type === "ack") onAck(m.id);
      return;
    }
    if (m.type === "hello") bc.postMessage(snapshot());
    else onPopupMsg(m);
  };

  if (MINI) {
    document.title = MINI === "sticky" ? "便籤" : "罐頭語";
    $("miniSticky").classList.toggle("hidden", MINI !== "sticky");
    $("miniSnip").classList.toggle("hidden", MINI !== "snip");
    if (MINI === "sticky" && !MINI_ID) miniStatus("缺少便籤編號");
    else miniStatus("連線中…");

    setStickyFont(stickyFont);
    $("msFontUp").onclick = () => setStickyFont(stickyFont + 2);
    $("msFontDn").onclick = () => setStickyFont(stickyFont - 2);
    $("msText").addEventListener("input", refreshStickyStatus);
    $("msText").addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        if (!$("msText").disabled) syncSticky();
      }
    });
    $("msSync").onclick = () => { if (!$("msText").disabled) syncSticky(); };
    $("msColor").onclick = () => bc.postMessage({ type: "stickyColor", id: MINI_ID });
    $("msNew").onclick = () => {
      const id = crypto.randomUUID();
      bc.postMessage({ type: "stickyCreate", id });
      window.open(BASE + "?mini=sticky&id=" + encodeURIComponent(id), "vault-sticky-" + id, "width=320,height=340");
    };
    $("msDel").onclick = () => {
      if (!confirm("確定要刪除這張便籤嗎？刪除後主工具中也會移除。")) return;
      bc.postMessage({ type: "stickyDelete", id: MINI_ID });
      miniLoaded = true;
      syncedBody = $("msText").value;
      setTimeout(() => window.close(), 300);
    };

    bc.postMessage({ type: "hello" });
    setInterval(() => bc.postMessage({ type: "hello" }), 3000);
    setInterval(() => {
      if (Date.now() - lastStateAt > 8000) miniStatus("找不到主畫面，請保持「我的網站清單」主頁開啟");
    }, 2000);
  }
</script>
</body>
</html>
