<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的網站清單</title>
<style>
  :root { --fg: #333; --muted: #666; --panel: #ffffff; --side: #ffffff; }
  body { font-family: system-ui, "Microsoft JhengHei", sans-serif; margin: 0; background: #fafafa; color: var(--fg); }
  header { color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #7c8db5; }
  header strong { font-size: 18px; }
  .hidden { display: none !important; }
  button { padding: 8px 12px; border: 0; border-radius: 8px; background: #7c8db5; color: #fff; cursor: pointer; margin: 2px; font-size: 14px; }
  button.gray { background: #9ca3af; }
  button.red { background: #e57373; }
  button.on { background: #4b5b80; }
  input, textarea, select { box-sizing: border-box; padding: 9px; margin: 4px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; color: #333; }
  input[type=text], input:not([type]), input[type=password], input[type=url], textarea { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--muted); font-size: 13px; margin: 4px 0; word-break: break-all; }
  .panel { background: var(--panel); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .center { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 320px; max-width: 90vw; }
  .area { padding: 16px; }

  /* 外框：左側分類 + 右側內容 */
  #shell { display: flex; min-height: calc(100vh - 52px); }
  aside { width: 190px; flex-shrink: 0; background: var(--side); padding: 12px; border-right: 1px solid rgba(127,127,127,.2); }
  aside h4 { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
  .cat-item { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; color: inherit; text-align: left; margin: 2px 0; padding: 8px 10px; }
  .cat-item.on { background: rgba(127,127,127,.2); }
  .cat-item .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); margin-right: 6px; vertical-align: middle; }
  main { flex: 1; padding: 16px; min-width: 0; }

  /* 分類面板 */
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; margin-top: 12px; }
  .panel-cat { border-radius: 14px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.05); }
  .panel-cat .ph { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .panel-cat .ph strong { font-size: 16px; color: #333; }
  .panel-cat .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: #333; }
  .panel-cat .tools input[type=color] { width: 36px; height: 28px; padding: 2px; margin: 0; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

  /* 網站卡片 */
  .item { border-radius: 12px; padding: 12px; color: #333; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item[draggable="true"] { cursor: grab; }
  .item.over { outline: 2px dashed #7c8db5; }
  .item .info { min-width: 0; }
  .item .info strong { display: block; font-size: 16px; margin-bottom: 2px; }
  .item .muted { color: #555; word-break: normal; overflow-wrap: anywhere; margin: 2px 0; }
  .item .btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; margin-top: 4px; }
  .tbtn { background: rgba(255,255,255,.8); color: #333; border: 1px solid rgba(0,0,0,.08); padding: 6px 8px; font-size: 13px; }
  .tbtn:hover { background: #fff; }

  /* 罐頭語 */
  .snRow { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .snLabel { width: 140px; flex-shrink: 0; font-weight: bold; padding-top: 6px; word-break: break-all; }
  .snText { flex: 1; min-width: 0; cursor: pointer; padding: 6px 8px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
  .snText:hover { background: rgba(124,141,181,.2); }
  .snBtns { display: flex; flex-direction: column; gap: 4px; }

  /* 便籤 */
  .stGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
  .stCard { border-radius: 12px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 6px; }
  .stCard textarea { background: rgba(255,255,255,.6); border: 0; resize: vertical; min-height: 110px; color: #333; }

  /* 記事本 */
  .nbWrap { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .nbList { width: 230px; flex-shrink: 0; }
  .nbItem { padding: 10px; border-radius: 10px; cursor: pointer; background: var(--panel); margin-bottom: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); word-break: break-all; }
  .nbItem.on { outline: 2px solid #7c8db5; }
  .nbEdit { flex: 1; min-width: 300px; background: var(--panel); border-radius: 14px; padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .nbEdit textarea { min-height: 220px; }
  .nbPasteBox { border: 2px dashed #9ca3af; border-radius: 10px; padding: 10px; text-align: center; color: #666; font-size: 13px; margin: 6px 0; }
  .nbImgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
  .imgWrap { display: flex; flex-direction: column; gap: 4px; }
  .imgWrap img { width: 100%; border-radius: 8px; cursor: zoom-in; display: block; background: #eee; min-height: 60px; }

  /* 顏色選擇 */
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; margin: 0; cursor: pointer; }
  .swatch.on { border-color: #333; }
  #eColor, #bgColor, #hdColor { width: 60px; height: 36px; padding: 2px; margin: 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; display: none; z-index: 9; }

  @media (max-width: 700px) {
    #shell { flex-direction: column; }
    aside { width: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid rgba(127,127,127,.2); }
    aside h4 { width: 100%; }
    .cat-item { width: auto; }
    #panels { grid-template-columns: 1fr; }
    .snLabel { width: 90px; }
  }
</style>
</head>
<body>

<header id="hdr">
  <strong id="hdTitle">我的網站清單</strong>
  <button id="logoutBtn" class="gray hidden">登出</button>
</header>

<!-- 1. 登入 -->
<section id="loginView" class="center">
  <div class="panel box">
    <h3>請用 Google 登入</h3>
    <button id="googleBtn">使用 Google 登入</button>
    <p id="loginMsg" class="muted"></p>
  </div>
</section>

<!-- 2. 輸入加密密碼 -->
<section id="unlockView" class="center hidden">
  <div class="panel box">
    <h3 id="unlockTitle">輸入加密密碼</h3>
    <p class="muted">這組密碼用來加密你的資料。忘記就無法解開，請妥善保存。</p>
    <input id="passphrase" type="password" placeholder="加密密碼">
    <button id="unlockBtn">解鎖</button>
    <p id="unlockMsg" class="muted"></p>
  </div>
</section>

<!-- 3. 主畫面 -->
<div id="vaultView" class="hidden" style="display:none;">
  <div class="row area" style="padding-bottom:0;">
    <button id="tabSites">網站清單</button>
    <button id="tabSnip" class="gray">罐頭語</button>
    <button id="tabSticky" class="gray">便籤</button>
    <button id="tabNote" class="gray">記事本</button>
  </div>

  <!-- 網站清單 -->
  <div id="shell">
    <aside>
      <h4>分類</h4>
      <div id="catList"></div>
    </aside>

    <main>
      <div class="row" style="justify-content: space-between;">
        <button id="openAllBtn">一鍵開啟全部網站</button>
        <button id="addBtn" class="gray">新增網站</button>
      </div>

      <input id="search" placeholder="搜尋名稱、網址、帳號、分類…" style="margin-top: 10px;">

      <div class="row muted" style="margin-top: 4px;">
        標題名稱：<input id="titleInput" placeholder="我的網站清單" style="width: 180px; margin: 0;">
        配色主題：
        <select id="themeSel"></select>
      </div>

      <div class="row muted" style="margin-top: 4px;">
        字體：
        <select id="fontSize">
          <option value="s">小</option>
          <option value="m">中</option>
          <option value="l">大</option>
        </select>
        頁面背景：<input id="bgColor" type="color" value="#fafafa">
        標題列顏色：<input id="hdColor" type="color" value="#7c8db5">
      </div>

      <div class="row" style="margin-top: 6px;">
        <button id="backupBtn" class="gray">下載加密備份</button>
        <label class="muted">還原備份：<input id="restoreFile" type="file" accept=".json" style="width: auto; border: 0; padding: 0;"></label>
      </div>

      <div id="editor" class="panel hidden" style="margin-top:14px;">
        <input id="eName" placeholder="名稱（例如 SH）">
        <input id="eCat" list="catOptions" placeholder="分類（選填，例如 平台 A）">
        <datalist id="catOptions"></datalist>
        <input id="eUrl" placeholder="網址（https://...）">
        <input id="eUser" placeholder="帳號">
        <input id="ePass" type="password" placeholder="密碼">
        <textarea id="eNote" rows="2" placeholder="備註（選填）"></textarea>

        <p class="muted">卡片顏色</p>
        <div class="row">
          <div id="swatches" class="row"></div>
          <label class="row muted">自選：<input id="eColor" type="color" value="#FFD6E0"></label>
          <label class="row muted">色碼：<input id="eHex" placeholder="#FFD6E0" maxlength="7" style="width: 110px; margin: 0;"></label>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="saveBtn">儲存</button>
          <button id="cancelBtn" class="gray">取消</button>
        </div>
        <p id="editMsg" class="muted"></p>
      </div>

      <div id="panels"></div>
    </main>
  </div>

  <!-- 罐頭語 -->
  <div id="snipArea" class="area hidden">
    <div class="panel">
      <input id="snLabel" placeholder="標籤（例如 稍候）">
      <textarea id="snText" rows="3" placeholder="內容（之後點一下就會複製）"></textarea>
      <div class="row">
        <button id="snSave">新增</button>
        <button id="snCancel" class="gray">取消</button>
        <span id="snMsg" class="muted"></span>
      </div>
    </div>
    <input id="snSearch" placeholder="搜尋罐頭語…">
    <div id="snList" style="margin-top:12px;"></div>
  </div>

  <!-- 便籤 -->
  <div id="stickyArea" class="area hidden">
    <div class="row"><button id="stAdd">＋ 新增便籤</button></div>
    <div id="stList" class="stGrid"></div>
  </div>

  <!-- 記事本 -->
  <div id="noteArea" class="area hidden">
    <div class="nbWrap">
      <div class="nbList">
        <button id="nbAdd" style="width:100%;">＋ 新增記事本</button>
        <div id="nbItems" style="margin-top:8px;"></div>
      </div>
      <div class="nbEdit" id="nbEdit">
        <p id="nbEmpty" class="muted">請先選擇或新增一則記事本。</p>
        <div id="nbForm" class="hidden">
          <input id="nbTitle" placeholder="標題">
          <textarea id="nbBody" placeholder="內容…"></textarea>
          <div class="nbPasteBox" id="nbPasteBox">點這裡，或在記事本任何地方按 Ctrl+V 貼上截圖</div>
          <div class="row">
            <button id="nbSave">儲存</button>
            <button id="nbDelete" class="red">刪除這則記事本</button>
            <span id="nbMsg" class="muted"></span>
          </div>
          <div id="nbImgs" class="nbImgs"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== 設定區 =====
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBZd0TJTOG-CVRmWCgGFV6Jiq3B3gNV3mk",
    authDomain: "ningzhao0918.firebaseapp.com",
    projectId: "ningzhao0918",
    appId: "1:329444672735:web:a743f288d61f6737e3956a"
  };
  const ALLOWED_EMAIL = "shee740113@gmail.com";
  // ====================================================================

  const THEMES = {
    "粉彩": { header: "#7c8db5", bg: "#fafafa", panel: "#ffffff",
      cards: ["#FFD6E0", "#FFE5B4", "#FFF5BA", "#C1F0D6", "#BDE0FE", "#D7C8F5", "#FFCFB3"] },
    "莫蘭迪": { header: "#8a9a8b", bg: "#f3f0ea", panel: "#ebe6df",
      cards: ["#C9B6A6", "#B8C4C2", "#D8C3B0", "#A7B1A8", "#CFC0BC", "#AEB8C7", "#E0D2C2"] },
    "星空": { header: "#1e2a4a", bg: "#0f1629", panel: "#1b2540",
      cards: ["#C7D2FE", "#DDD6FE", "#BAE6FD", "#A5F3FC", "#FBCFE8", "#E9D5FF", "#BFDBFE"] },
    "奶油": { header: "#c8a27a", bg: "#fff8ee", panel: "#fff1dc",
      cards: ["#FFE8C2", "#F9DCC4", "#FDF0D5", "#F6D6B8", "#EFE3C8", "#FBE7D1", "#E8D5B7"] },
    "海島": { header: "#0f8b8d", bg: "#e6f7f7", panel: "#d2f0ee",
      cards: ["#A8E6E6", "#9FD8F0", "#B5F0D8", "#FFE9A8", "#BFE9FF", "#CDEFE0", "#F7E7B5"] },
    "綠色療癒": { header: "#4f7f5f", bg: "#f2f7f1", panel: "#e2efe0",
      cards: ["#C8E6C9", "#DCEDC8", "#B2DFDB", "#E6F4D7", "#C5E1A5", "#D7EFD0", "#BFE8C8"] }
  };
  const ZOOM = { s: 0.9, m: 1, l: 1.2 };
  const NOCAT = "未分類";
  const DEFAULT_TITLE = "我的網站清單";
  const MAX_IMG_CHARS = 900000;

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let user = null;
  let key = null;
  let salt = null;
  let items = [];
  let snippets = [];
  let notes = [];
  let settings = { bg: "#fafafa", font: "m", header: "#7c8db5", theme: "粉彩", title: DEFAULT_TITLE, catColors: {} };
  let editingId = null;
  let dragId = null;
  let activeCat = null;
  let snEditId = null;
  let nbSelId = null;
  let area = "sites";
  const imgCache = new Map();

  const $ = id => document.getElementById(id);
  const textEnc = new TextEncoder();
  const textDec = new TextDecoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function show(view) {
    ["loginView", "unlockView", "vaultView"].forEach(v => $(v).classList.add("hidden"));
    $(view).classList.remove("hidden");
    $("vaultView").style.display = view === "vaultView" ? "block" : "none";
    $("logoutBtn").classList.toggle("hidden", view === "loginView");
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => (t.style.display = "none"), 1500);
  }

  // ===== 顏色工具 =====
  function isDark(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 0.299 * r + 0.587 * g + 0.114 * b < 140;
  }
  function theme() { return THEMES[settings.theme] || THEMES["粉彩"]; }
  function palette() { return theme().cards; }

  // ===== 加密 =====
  async function deriveKey(pass, saltBytes) {
    const base = await crypto.subtle.importKey("raw", textEnc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: 310000, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function sealWith(k, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, textEnc.encode(text));
    return { iv: b64(iv), data: b64(ct) };
  }

  async function openWith(k, obj) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(obj.iv) }, k, unb64(obj.data));
    return textDec.decode(pt);
  }

  function vaultPayload() {
    return { items, snippets, notes, settings };
  }

  async function saveVault() {
    const sealed = await sealWith(key, JSON.stringify(vaultPayload()));
    await setDoc(doc(db, "vaults", user.uid), {
      salt: b64(salt),
      iv: sealed.iv,
      data: sealed.data,
      updated: Date.now()
    });
  }

  async function persist(msg) {
    try {
      await saveVault();
      if (msg) toast(msg);
    } catch (e) {
      toast("儲存失敗：" + e.message);
    }
  }

  // ===== 圖片 =====
  function compressImage(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("無法讀取圖片")); };
      img.src = url;
    });
  }

  async function addImage(blob) {
    const dataUrl = await compressImage(blob);
    const sealed = await sealWith(key, dataUrl);
    const size = sealed.data.length + sealed.iv.length;
    if (size > MAX_IMG_CHARS) throw new Error("圖片太大，請截小一點");
    const id = crypto.randomUUID();
    await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now() });
    imgCache.set(id, dataUrl);
    return id;
  }

  async function getImage(id) {
    if (imgCache.has(id)) return imgCache.get(id);
    const snap = await getDoc(doc(db, "vaults", user.uid, "images", id));
    if (!snap.exists()) return null;
    const url = await openWith(key, snap.data());
    imgCache.set(id, url);
    return url;
  }

  async function removeImage(id) {
    await deleteDoc(doc(db, "vaults", user.uid, "images", id));
    imgCache.delete(id);
  }

  // ===== 登入 =====
  $("googleBtn").onclick = async () => {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (e) {
      $("loginMsg").textContent = "登入失敗：" + e.message;
    }
  };

  onAuthStateChanged(auth, async u => {
    if (!u) {
      user = null; key = null; items = []; snippets = []; notes = [];
      imgCache.clear();
      show("loginView");
      return;
    }
    if (u.email !== ALLOWED_EMAIL) {
      $("loginMsg").textContent = "此 Google 帳號沒有使用權限";
      await signOut(auth);
      return;
    }
    user = u;
    $("passphrase").value = "";
    $("unlockMsg").textContent = "";
    show("unlockView");
  });

  // ===== 解鎖 =====
  $("unlockBtn").onclick = async () => {
    const pass = $("passphrase").value;
    if (!pass) { $("unlockMsg").textContent = "請輸入加密密碼"; return; }
    try {
      const snap = await getDoc(doc(db, "vaults", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        salt = unb64(d.salt);
        key = await deriveKey(pass, salt);
        const p = JSON.parse(await openWith(key, d));
        if (Array.isArray(p)) {
          items = p;
        } else {
          items = p.items || [];
          snippets = p.snippets || [];
          notes = p.notes || [];
          const s = p.settings || {};
          settings = { ...settings, ...s, catColors: { ...(s.catColors || {}) } };
        }
      } else {
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await deriveKey(pass, salt);
        await saveVault();
      }
      applyAll();
      show("vaultView");
      showArea("sites");
      render();
    } catch (e) {
      $("unlockMsg").textContent = "解鎖失敗：加密密碼不正確，或資料損壞";
    }
  };

  $("passphrase").addEventListener("keydown", e => { if (e.key === "Enter") $("unlockBtn").click(); });

  // ===== 登出 =====
  $("logoutBtn").onclick = async () => {
    await signOut(auth);
    toast("已登出");
  };

  // ===== 分頁切換 =====
  function showArea(name) {
    area = name;
    const map = { sites: "shell", snip: "snipArea", sticky: "stickyArea", note: "noteArea" };
    Object.values(map).forEach(id => $(id).classList.add("hidden"));
    $(map[name]).classList.remove("hidden");
    const tabs = { sites: "tabSites", snip: "tabSnip", sticky: "tabSticky", note: "tabNote" };
    Object.entries(tabs).forEach(([k, id]) => {
      const b = $(id);
      b.classList.toggle("on", k === name);
      b.classList.toggle("gray", k !== name);
    });
    if (name === "snip") renderSnippets();
    if (name === "sticky") renderStickies();
    if (name === "note") renderNotebook();
  }

  $("tabSites").onclick = () => showArea("sites");
  $("tabSnip").onclick = () => showArea("snip");
  $("tabSticky").onclick = () => showArea("sticky");
  $("tabNote").onclick = () => showArea("note");

  // ===== 外觀設定 =====
  function applyAll() {
    applyThemeSelect();
    applyBg();
    applyFont();
    applyHeader();
    applyTitle();
  }

  function applyThemeSelect() {
    const sel = $("themeSel");
    if (!sel.options.length) {
      Object.keys(THEMES).forEach(name => {
        const o = document.createElement("option");
        o.value = name;
        o.textContent = name;
        sel.appendChild(o);
      });
    }
    sel.value = settings.theme in THEMES ? settings.theme : "粉彩";
  }

  function applyBg() {
    const c = settings.bg || "#fafafa";
    const dark = isDark(c);
    document.body.style.background = c;
    $("bgColor").value = c;
    const root = document.documentElement.style;
    root.setProperty("--fg", dark ? "#e5e7eb" : "#333");
    root.setProperty("--muted", dark ? "#aab3c5" : "#666");
    root.setProperty("--panel", theme().panel);
    root.setProperty("--side", theme().panel);
  }

  function applyFont() {
    const f = settings.font || "m";
    document.body.style.zoom = ZOOM[f];
    $("fontSize").value = f;
  }

  function applyHeader() {
    const c = settings.header || "#7c8db5";
    $("hdr").style.background = c;
    $("hdr").style.color = isDark(c) ? "#fff" : "#222";
    $("hdColor").value = c;
  }

  function applyTitle() {
    const t = settings.title || DEFAULT_TITLE;
    $("hdTitle").textContent = t;
    $("titleInput").value = settings.title && settings.title !== DEFAULT_TITLE ? settings.title : "";
    document.title = t;
  }

  $("themeSel").addEventListener("change", async e => {
    const name = e.target.value;
    const t = THEMES[name];
    settings.theme = name;
    settings.header = t.header;
    settings.bg = t.bg;
    settings.catColors = {};
    applyAll();
    render();
    await persist("已套用配色：" + name);
  });

  $("bgColor").addEventListener("change", async e => {
    settings.bg = e.target.value;
    applyBg();
    render();
    await persist("背景已儲存");
  });

  $("hdColor").addEventListener("change", async e => {
    settings.header = e.target.value;
    applyHeader();
    await persist("標題列顏色已儲存");
  });

  $("titleInput").addEventListener("change", async e => {
    settings.title = e.target.value.trim() || DEFAULT_TITLE;
    applyTitle();
    await persist("標題已儲存");
  });

  $("fontSize").addEventListener("change", async e => {
    settings.font = e.target.value;
    applyFont();
    await persist("字體已儲存");
  });

  // ===== 搜尋 =====
  $("search").addEventListener("input", render);

  // ===== 備份與還原（含圖片） =====
  $("backupBtn").onclick = async () => {
    try {
      const images = {};
      const snap = await getDocs(collection(db, "vaults", user.uid, "images"));
      for (const d of snap.docs) {
        images[d.id] = await openWith(key, d.data());
      }
      const sealed = await sealWith(key, JSON.stringify({ ...vaultPayload(), images }));
      const payload = { format: "vault-backup-v2", salt: b64(salt), iv: sealed.iv, data: sealed.data };
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "網站清單備份-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("備份已下載（請妥善保管）");
    } catch (e) {
      toast("備份失敗：" + e.message);
    }
  };

  $("restoreFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const pass = prompt("請輸入這份備份當時使用的加密密碼：");
    if (!pass) return;
    try {
      const d = JSON.parse(await file.text());
      const k = await deriveKey(pass, unb64(d.salt));
      const p = JSON.parse(await openWith(k, d));
      if (!confirm("還原會覆蓋目前的資料，確定要還原嗎？")) return;
      items = p.items || [];
      snippets = p.snippets || [];
      notes = p.notes || [];
      settings = { ...settings, ...(p.settings || {}) };
      for (const [id, url] of Object.entries(p.images || {})) {
        const sealed = await sealWith(key, url);
        await setDoc(doc(db, "vaults", user.uid, "images", id), { ...sealed, created: Date.now() });
        imgCache.set(id, url);
      }
      applyAll();
      await persist("已還原");
      render();
    } catch (err) {
      toast("還原失敗：密碼不正確或檔案已損壞");
    }
  });

  // ===== 複製 =====
  async function copy(text) {
    await navigator.clipboard.writeText(text);
    toast("已複製");
  }

  // ===== 網站排序 =====
  async function moveBefore(fromId, toId) {
    const from = items.find(x => x.id === fromId);
    const to = items.find(x => x.id === toId);
    if (!from || !to || from === to) return;
    items = items.filter(x => x.id !== fromId);
    from.category = to.category || "";
    const idx = items.findIndex(x => x.id === toId);
    items.splice(idx, 0, from);
    await persist();
    render();
  }

  async function moveStep(id, dir) {
    const i = items.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    await persist();
    render();
  }

  // ===== 分類側欄 =====
  function catOf(it) { return it.category || NOCAT; }
  function catColor(c) { return (settings.catColors || {})[c] || theme().panel; }

  function renderSidebar() {
    const box = $("catList");
    box.textContent = "";
    const counts = new Map();
    items.forEach(it => counts.set(catOf(it), (counts.get(catOf(it)) || 0) + 1));

    const addBtn = (label, count, value, color) => {
      const b = document.createElement("button");
      b.className = "cat-item" + (activeCat === value ? " on" : "");
      const left = document.createElement("span");
      if (color) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = color;
        left.appendChild(dot);
      }
      left.appendChild(document.createTextNode(label));
      const right = document.createElement("span");
      right.style.opacity = "0.7";
      right.textContent = count;
      b.appendChild(left);
      b.appendChild(right);
      b.onclick = () => { activeCat = value; render(); };
      box.appendChild(b);
    };

    addBtn("全部", items.length, null, null);
    counts.forEach((n, c) => addBtn(c, n, c, catColor(c)));
  }

  // ===== 網站主畫面 =====
  function render() {
    renderSidebar();
    const panels = $("panels");
    panels.textContent = "";

    if (!items.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "還沒有網站，按「新增網站」開始。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const q = $("search").value.trim().toLowerCase();
    const searching = q !== "";
    const visible = items.filter(it =>
      (!activeCat || catOf(it) === activeCat) &&
      (!searching || [it.name, it.url, it.username, it.note || "", it.category || ""].some(s => s.toLowerCase().includes(q)))
    );

    if (!visible.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "找不到符合的網站。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const groups = new Map();
    visible.forEach(it => {
      const c = catOf(it);
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(it);
    });

    groups.forEach((arr, cat) => panels.appendChild(catPanel(cat, arr, !searching)));
    renderCatOptions();
  }

  function smallBtn(text, fn, cls = "") {
    const b = document.createElement("button");
    b.textContent = text;
    b.className = cls;
    b.onclick = fn;
    return b;
  }

  function catPanel(cat, arr, canReorder) {
    const p = document.createElement("div");
    p.className = "panel-cat";
    p.style.background = catColor(cat);

    const ph = document.createElement("div");
    ph.className = "ph";
    const title = document.createElement("strong");
    title.textContent = cat + "（" + arr.length + "）";
    ph.appendChild(title);

    const tools = document.createElement("div");
    tools.className = "tools";
    tools.appendChild(smallBtn("開啟本類全部", () => arr.forEach(it => window.open(it.url, "_blank", "noopener"))));

    const panelPick = document.createElement("input");
    panelPick.type = "color";
    panelPick.value = catColor(cat);
    panelPick.title = "面板顏色";
    panelPick.addEventListener("change", async e => {
      settings.catColors = { ...(settings.catColors || {}), [cat]: e.target.value };
      render();
      await persist("面板顏色已儲存");
    });
    const panelLabel = document.createElement("span");
    panelLabel.textContent = "面板";
    tools.appendChild(panelLabel);
    tools.appendChild(panelPick);

    const cardPick = document.createElement("input");
    cardPick.type = "color";
    cardPick.value = arr[0].color || palette()[0];
    cardPick.title = "本類卡片顏色";
    cardPick.addEventListener("change", async e => {
      items.forEach(x => { if (catOf(x) === cat) x.color = e.target.value; });
      render();
      await persist("本類卡片顏色已更新");
    });
    const cardLabel = document.createElement("span");
    cardLabel.textContent = "卡片";
    tools.appendChild(cardLabel);
    tools.appendChild(cardPick);

    ph.appendChild(tools);
    p.appendChild(ph);

    const grid = document.createElement("div");
    grid.className = "items";
    arr.forEach(it => grid.appendChild(itemRow(it, canReorder)));
    p.appendChild(grid);
    return p;
  }

  function tbtn(text, fn, extra = "") {
    const b = document.createElement("button");
    b.textContent = text;
    b.className = "tbtn " + extra;
    b.onclick = fn;
    return b;
  }

  function itemRow(it, canReorder) {
    const row = document.createElement("div");
    row.className = "item";
    row.style.background = it.color || palette()[0];

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("strong");
    name.textContent = it.name;
    info.appendChild(name);
    const acc = document.createElement("div");
    acc.className = "muted";
    acc.textContent = "帳號：" + it.username;
    info.appendChild(acc);
    if (it.note) {
      const n = document.createElement("div");
      n.className = "muted";
      n.textContent = it.note;
      info.appendChild(n);
    }
    row.appendChild(info);

    const btns = document.createElement("div");
    btns.className = "btns";
    btns.appendChild(tbtn("開啟", () => window.open(it.url, "_blank", "noopener")));
    btns.appendChild(tbtn("複製帳號", () => copy(it.username)));
    btns.appendChild(tbtn("複製密碼", () => copy(it.password)));
    btns.appendChild(tbtn("編輯", () => openEditor(it)));
    btns.appendChild(tbtn("刪除", () => removeItem(it.id), "red"));
    if (canReorder) {
      btns.appendChild(tbtn("↑", () => moveStep(it.id, -1), "gray"));
      btns.appendChild(tbtn("↓", () => moveStep(it.id, 1), "gray"));
    }
    row.appendChild(btns);

    if (canReorder) {
      row.draggable = true;
      row.addEventListener("dragstart", e => {
        dragId = it.id;
        e.dataTransfer.effectAllowed = "move";
        row.style.opacity = "0.5";
      });
      row.addEventListener("dragend", () => {
        dragId = null;
        row.style.opacity = "1";
      });
      row.addEventListener("dragover", e => {
        e.preventDefault();
        row.classList.add("over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("over"));
      row.addEventListener("drop", e => {
        e.preventDefault();
        row.classList.remove("over");
        if (dragId) moveBefore(dragId, it.id);
      });
    }
    return row;
  }

  function renderCatOptions() {
    const dl = $("catOptions");
    dl.textContent = "";
    [...new Set(items.map(x => x.category).filter(Boolean))].forEach(c => {
      const o = document.createElement("option");
      o.value = c;
      dl.appendChild(o);
    });
  }

  $("openAllBtn").onclick = () => {
    items.forEach(it => window.open(it.url, "_blank", "noopener"));
  };

  // ===== 顏色選擇 =====
  function setColor(c) {
    $("eColor").value = c;
    if (document.activeElement !== $("eHex")) $("eHex").value = c.toUpperCase();
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.color.toLowerCase() === c.toLowerCase()));
  }

  function buildSwatches() {
    const box = $("swatches");
    box.textContent = "";
    palette().forEach(c => {
      const s = document.createElement("button");
      s.className = "swatch";
      s.dataset.color = c;
      s.style.background = c;
      s.title = c;
      s.onclick = e => { e.preventDefault(); setColor(c); };
      box.appendChild(s);
    });
  }

  $("eColor").addEventListener("input", e => setColor(e.target.value));

  $("eHex").addEventListener("input", e => {
    let v = e.target.value.trim();
    if (v && !v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      $("editMsg").textContent = "";
      setColor(v);
    } else if (v.length >= 7) {
      $("editMsg").textContent = "色碼格式不正確，要 6 位數，例如 #215487";
    }
  });

  // ===== 網站編輯 =====
  function openEditor(it = null) {
    editingId = it ? it.id : null;
    $("eName").value = it ? it.name : "";
    $("eCat").value = it ? (it.category || "") : (activeCat && activeCat !== NOCAT ? activeCat : "");
    $("eUrl").value = it ? it.url : "";
    $("eUser").value = it ? it.username : "";
    $("ePass").value = it ? it.password : "";
    $("eNote").value = it ? (it.note || "") : "";
    $("editMsg").textContent = "";
    renderCatOptions();
    buildSwatches();
    setColor(it && it.color ? it.color : palette()[0]);
    $("editor").classList.remove("hidden");
    $("editor").scrollIntoView({ behavior: "smooth" });
  }

  function closeEditor() {
    $("editor").classList.add("hidden");
    editingId = null;
  }

  $("addBtn").onclick = () => openEditor();
  $("cancelBtn").onclick = closeEditor;

  $("saveBtn").onclick = async () => {
    const data = {
      name: $("eName").value.trim(),
      category: $("eCat").value.trim(),
      url: $("eUrl").value.trim(),
      username: $("eUser").value,
      password: $("ePass").value,
      note: $("eNote").value.trim(),
      color: $("eColor").value
    };
    if (!data.name) { $("editMsg").textContent = "請輸入名稱"; return; }
    if (!/^https?:\/\//.test(data.url)) { $("editMsg").textContent = "網址要以 https:// 開頭"; return; }

    if (editingId) {
      items = items.map(x => (x.id === editingId ? { ...x, ...data } : x));
    } else {
      items.push({ id: crypto.randomUUID(), ...data });
    }
    try {
      await saveVault();
      closeEditor();
      render();
      toast("已儲存");
    } catch (e) {
      $("editMsg").textContent = "儲存失敗：" + e.message;
    }
  };

  async function removeItem(id) {
    if (!confirm("確定要刪除這個網站嗎？")) return;
    items = items.filter(x => x.id !== id);
    await persist();
    render();
  }

  // ===== 罐頭語 =====
  function renderSnippets() {
    const list = $("snList");
    list.textContent = "";
    const q = $("snSearch").value.trim().toLowerCase();
    const shown = snippets.filter(s => !q || s.label.toLowerCase().includes(q) || s.text.toLowerCase().includes(q));
    if (!shown.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = snippets.length ? "找不到符合的罐頭語。" : "還沒有罐頭語，請在上方新增。";
      list.appendChild(p);
      return;
    }
    shown.forEach(s => {
      const row = document.createElement("div");
      row.className = "snRow";

      const label = document.createElement("div");
      label.className = "snLabel";
      label.textContent = s.label;

      const text = document.createElement("div");
      text.className = "snText";
      text.textContent = s.text;
      text.title = "點一下複製內容";
      text.onclick = () => copy(s.text);

      const btns = document.createElement("div");
      btns.className = "snBtns";
      btns.appendChild(tbtn("編輯", () => editSnippet(s)));
      btns.appendChild(tbtn("刪除", () => removeSnippet(s.id), "red"));

      row.append(label, text, btns);
      list.appendChild(row);
    });
  }

  function resetSnForm() {
    snEditId = null;
    $("snLabel").value = "";
    $("snText").value = "";
    $("snSave").textContent = "新增";
    $("snMsg").textContent = "";
  }

  function editSnippet(s) {
    snEditId = s.id;
    $("snLabel").value = s.label;
    $("snText").value = s.text;
    $("snSave").textContent = "儲存";
    $("snMsg").textContent = "編輯中";
    $("snLabel").scrollIntoView({ behavior: "smooth" });
  }

  async function removeSnippet(id) {
    if (!confirm("確定要刪除這則罐頭語嗎？")) return;
    snippets = snippets.filter(x => x.id !== id);
    await persist();
    renderSnippets();
  }

  $("snSave").onclick = async () => {
    const label = $("snLabel").value.trim();
    const text = $("snText").value.trim();
    if (!label) { $("snMsg").textContent = "請輸入標籤"; return; }
    if (!text) { $("snMsg").textContent = "請輸入內容"; return; }
    if (snEditId) {
      snippets = snippets.map(x => (x.id === snEditId ? { ...x, label, text } : x));
    } else {
      snippets.push({ id: crypto.randomUUID(), label, text });
    }
    resetSnForm();
    await persist("罐頭語已儲存");
    renderSnippets();
  };

  $("snCancel").onclick = resetSnForm;
  $("snSearch").addEventListener("input", renderSnippets);

  // ===== 便籤 =====
  function renderStickies() {
    const list = $("stList");
    list.textContent = "";
    const stickies = notes.filter(n => n.type === "sticky");
    if (!stickies.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "還沒有便籤，按上方「新增便籤」。";
      list.appendChild(p);
    }
    stickies.forEach(n => {
      const card = document.createElement("div");
      card.className = "stCard";
      card.style.background = n.color || palette()[0];

      const ta = document.createElement("textarea");
      ta.value = n.body || "";
      ta.placeholder = "寫點什麼…";
      ta.addEventListener("change", async () => {
        n.body = ta.value;
        n.updated = Date.now();
        await persist("便籤已儲存");
      });

      const btns = document.createElement("div");
      btns.className = "row";
      btns.appendChild(tbtn("換色", async () => {
        const cards = palette();
        const i = cards.indexOf(n.color);
        n.color = cards[(i + 1) % cards.length];
        await persist();
        renderStickies();
      }));
      btns.appendChild(tbtn("刪除", async () => {
        if (!confirm("確定要刪除這張便籤嗎？")) return;
        notes = notes.filter(x => x.id !== n.id);
        await persist();
        renderStickies();
      }, "red"));

      card.append(ta, btns);
      list.appendChild(card);
    });
  }

  $("stAdd").onclick = async () => {
    const cards = palette();
    const count = notes.filter(n => n.type === "sticky").length;
    notes.push({ id: crypto.randomUUID(), type: "sticky", title: "", body: "", images: [], color: cards[count % cards.length], updated: Date.now() });
    await persist();
    renderStickies();
  };

  // ===== 記事本 =====
  function currentNote() {
    return notes.find(n => n.id === nbSelId && n.type === "notebook") || null;
  }

  function renderNotebook() {
    const box = $("nbItems");
    box.textContent = "";
    const books = notes.filter(n => n.type === "notebook").sort((a, b) => (b.updated || 0) - (a.updated || 0));
    books.forEach(n => {
      const it = document.createElement("div");
      it.className = "nbItem" + (n.id === nbSelId ? " on" : "");
      it.textContent = n.title || "未命名";
      it.onclick = () => { nbSelId = n.id; renderNotebook(); };
      box.appendChild(it);
    });

    const note = currentNote();
    $("nbEmpty").classList.toggle("hidden", !!note);
    $("nbForm").classList.toggle("hidden", !note);
    if (note) {
      $("nbTitle").value = note.title || "";
      $("nbBody").value = note.body || "";
      renderNbImages(note);
    }
  }

  $("nbAdd").onclick = async () => {
    const n = { id: crypto.randomUUID(), type: "notebook", title: "未命名", body: "", images: [], updated: Date.now() };
    notes.push(n);
    nbSelId = n.id;
    await persist();
    renderNotebook();
  };

  $("nbSave").onclick = async () => {
    const note = currentNote();
    if (!note) return;
    note.title = $("nbTitle").value.trim() || "未命名";
    note.body = $("nbBody").value;
    note.updated = Date.now();
    await persist("記事本已儲存");
    renderNotebook();
  };

  $("nbDelete").onclick = async () => {
    const note = currentNote();
    if (!note) return;
    if (!confirm("確定要刪除這則記事本（包含所有截圖）嗎？")) return;
    for (const id of note.images || []) {
      try { await removeImage(id); } catch (e) {}
    }
    notes = notes.filter(n => n.id !== note.id);
    nbSelId = null;
    await persist("已刪除");
    renderNotebook();
  };

  async function pasteImages(e) {
    const files = [...(e.clipboardData ? e.clipboardData.items : [])]
      .filter(i => i.type.startsWith("image/"))
      .map(i => i.getAsFile());
    if (!files.length) return;
    e.preventDefault();
    const note = currentNote();
    if (!note) { toast("請先選擇或新增一則記事本"); return; }
    toast("圖片加入中，請稍候…");
    $("nbMsg").textContent = "圖片處理中…";
    for (const f of files) {
      try {
        const id = await addImage(f);
        note.images = note.images || [];
        note.images.push(id);
      } catch (err) {
        toast("圖片加入失敗：" + err.message);
      }
    }
    note.updated = Date.now();
    await persist("圖片已加入");
    $("nbMsg").textContent = "";
    renderNbImages(note);
  }

  // 只要在「記事本」分頁，按 Ctrl+V 都會嘗試貼上圖片（不必先點在內容框裡）
  document.addEventListener("paste", e => {
    if (area !== "note") return;
    pasteImages(e);
  });

  $("nbPasteBox").addEventListener("click", () => $("nbBody").focus());

  function renderNbImages(note) {
    const box = $("nbImgs");
    box.textContent = "";
    (note.images || []).forEach(id => {
      const wrap = document.createElement("div");
      wrap.className = "imgWrap";

      const img = document.createElement("img");
      img.alt = "截圖";
      img.title = "點一下放大";
      img.onclick = async () => {
        const u = await getImage(id);
        if (u) window.open(u, "_blank");
      };
      getImage(id).then(u => { if (u) img.src = u; }).catch(() => {});

      const del = smallBtn("刪除這張圖", async () => {
        if (!confirm("確定要刪除這張圖片嗎？")) return;
        note.images = note.images.filter(x => x !== id);
        try { await removeImage(id); } catch (e) {}
        await persist("已刪除圖片");
        renderNbImages(note);
      }, "red");

      wrap.append(img, del);
      box.appendChild(wrap);
    });
  }
</script>
</body>
</html>
