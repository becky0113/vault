<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的网站清单</title>
<style>
  body { font-family: system-ui, "Microsoft JhengHei", sans-serif; margin: 0; background: #fafafa; color: #333; }
  header { color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #7c8db5; }
  header strong { font-size: 18px; }
  .hidden { display: none !important; }
  button { padding: 8px 12px; border: 0; border-radius: 8px; background: #7c8db5; color: #fff; cursor: pointer; margin: 2px; font-size: 14px; }
  button.gray { background: #9ca3af; }
  button.red { background: #e57373; }
  input, textarea, select { box-sizing: border-box; padding: 9px; margin: 4px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; background: #fff; }
  input[type=text], input:not([type]), input[type=password], input[type=url], textarea { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: #666; font-size: 13px; margin: 4px 0; word-break: break-all; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
  .center { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .box { width: 320px; max-width: 90vw; }

  /* 外框：左侧分类 + 右侧内容 */
  #shell { display: flex; min-height: calc(100vh - 52px); }
  aside { width: 190px; flex-shrink: 0; background: rgba(255,255,255,.7); padding: 12px; border-right: 1px solid #e5e7eb; }
  aside h4 { margin: 4px 0 8px; color: #555; font-size: 13px; }
  .cat-item { display: flex; justify-content: space-between; align-items: center; width: 100%; background: transparent; color: #333; text-align: left; margin: 2px 0; padding: 8px 10px; }
  .cat-item.on { background: #e0e7ff; }
  .cat-item .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); margin-right: 6px; vertical-align: middle; }
  main { flex: 1; padding: 16px; min-width: 0; }

  /* 分类面板 */
  #panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; align-items: start; margin-top: 12px; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .panel-cat { border-radius: 14px; padding: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.05); }
  .panel-cat .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .panel-cat .ph strong { font-size: 16px; }
  .panel-cat .ph input[type=color] { width: 36px; height: 28px; padding: 2px; margin: 0; }

  /* 网站列 */
  .item { border-radius: 12px; padding: 12px; color: #333; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .item[draggable="true"] { cursor: grab; }
  .item.over { outline: 2px dashed #7c8db5; }
  .item .info { min-width: 0; }
  .item .info strong { display: block; font-size: 16px; margin-bottom: 2px; }
  .item .muted { word-break: normal; overflow-wrap: anywhere; margin: 2px 0; }
  .item .btns { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-start; margin-top: 4px; }
  .tbtn { background: rgba(255,255,255,.8); color: #333; border: 1px solid rgba(0,0,0,.08); padding: 6px 8px; font-size: 13px; }
  .tbtn:hover { background: #fff; }

  /* 颜色选择 */
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; padding: 0; margin: 0; cursor: pointer; }
  .swatch.on { border-color: #333; }
  #eColor, #bgColor, #hdColor { width: 60px; height: 36px; padding: 2px; margin: 0; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 8px; display: none; z-index: 9; }

  @media (max-width: 700px) {
    #shell { flex-direction: column; }
    aside { width: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid #e5e7eb; }
    aside h4 { width: 100%; }
    .cat-item { width: auto; }
    #panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header id="hdr">
  <strong>我的网站清单</strong>
  <button id="logoutBtn" class="gray hidden">登出</button>
</header>

<!-- 1. 登入 -->
<section id="loginView" class="center">
  <div class="panel box">
    <h3>请用 Google 登入</h3>
    <button id="googleBtn">使用 Google 登入</button>
    <p id="loginMsg" class="muted"></p>
  </div>
</section>

<!-- 2. 输入加密密码 -->
<section id="unlockView" class="center hidden">
  <div class="panel box">
    <h3 id="unlockTitle">输入加密密码</h3>
    <p class="muted">这组密码用来加密你的资料。忘记就无法解开，请妥善保存。</p>
    <input id="passphrase" type="password" placeholder="加密密码">
    <button id="unlockBtn">解锁</button>
    <p id="unlockMsg" class="muted"></p>
  </div>
</section>

<!-- 3. 清单 -->
<div id="vaultView" class="hidden" style="display:none;">
  <div id="shell">
    <aside>
      <h4>分类</h4>
      <div id="catList"></div>
    </aside>

    <main>
      <div class="row" style="justify-content: space-between;">
        <button id="openAllBtn">一键开启全部网站</button>
        <button id="addBtn" class="gray">新增网站</button>
      </div>

      <input id="search" placeholder="搜寻名称、网址、帐号、分类…" style="margin-top: 10px;">

      <div class="row muted" style="margin-top: 4px;">
        字体：
        <select id="fontSize">
          <option value="s">小</option>
          <option value="m">中</option>
          <option value="l">大</option>
        </select>
        页面背景：<input id="bgColor" type="color" value="#fafafa">
        标题列颜色：<input id="hdColor" type="color" value="#7c8db5">
      </div>

      <div class="row" style="margin-top: 6px;">
        <button id="backupBtn" class="gray">下载加密备份</button>
        <label class="muted">还原备份：<input id="restoreFile" type="file" accept=".json" style="width: auto; border: 0; padding: 0;"></label>
      </div>

      <div id="editor" class="panel hidden" style="margin-top:14px;">
        <input id="eName" placeholder="名称（例如 SH）">
        <input id="eCat" list="catOptions" placeholder="分类（选填，例如 平台 A）">
        <datalist id="catOptions"></datalist>
        <input id="eUrl" placeholder="网址（https://...）">
        <input id="eUser" placeholder="帐号">
        <input id="ePass" type="password" placeholder="密码">
        <textarea id="eNote" rows="2" placeholder="备注（选填）"></textarea>

        <p class="muted">卡片颜色</p>
        <div class="row">
          <div id="swatches" class="row"></div>
          <label class="row muted">自选：<input id="eColor" type="color" value="#FFD6E0"></label>
          <label class="row muted">色码：<input id="eHex" placeholder="#FFD6E0" maxlength="7" style="width: 110px; margin: 0;"></label>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="saveBtn">储存</button>
          <button id="cancelBtn" class="gray">取消</button>
        </div>
        <p id="editMsg" class="muted"></p>
      </div>

      <div id="panels"></div>
    </main>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ===== 设定区 =====
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBZd0TJTOG-CVRmWCgGFV6Jiq3B3gNV3mk",
    authDomain: "ningzhao0918.firebaseapp.com",
    projectId: "ningzhao0918",
    appId: "1:329444672735:web:a743f288d61f6737e3956a"
  };
  const ALLOWED_EMAIL = "shee740113@gmail.com";
  // ====================================================================

  const PRESETS = ["#FFD6E0", "#FFE5B4", "#FFF5BA", "#C1F0D6", "#BDE0FE", "#D7C8F5", "#FFCFB3"];
  const ZOOM = { s: 0.9, m: 1, l: 1.2 };
  const NOCAT = "未分类";

  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let user = null;
  let key = null;
  let salt = null;
  let items = [];
  let settings = { bg: "#fafafa", font: "m", header: "#7c8db5", catColors: {} };
  let editingId = null;
  let dragId = null;
  let activeCat = null; // null = 全部

  const $ = id => document.getElementById(id);
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  function show(view) {
    ["loginView", "unlockView", "vaultView"].forEach(v => $(v).classList.add("hidden"));
    $(view).classList.remove("hidden");
    $("vaultView").style.display = view === "vaultView" ? "block" : "none";
    $("logoutBtn").classList.toggle("hidden", view === "loginView");
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => (t.style.display = "none"), 1500);
  }

  // ===== 加密 =====
  async function deriveKey(pass, saltBytes) {
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltBytes, iterations: 310000, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function saveVault() {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify({ items, settings })));
    await setDoc(doc(db, "vaults", user.uid), {
      salt: b64(salt),
      iv: b64(iv),
      data: b64(ct),
      updated: Date.now()
    });
  }

  async function persist(msg) {
    try {
      await saveVault();
      if (msg) toast(msg);
    } catch (e) {
      toast("储存失败：" + e.message);
    }
  }

  // ===== 登入 =====
  $("googleBtn").onclick = async () => {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (e) {
      $("loginMsg").textContent = "登入失败：" + e.message;
    }
  };

  onAuthStateChanged(auth, async u => {
    if (!u) {
      user = null; key = null; items = [];
      show("loginView");
      return;
    }
    if (u.email !== ALLOWED_EMAIL) {
      $("loginMsg").textContent = "此 Google 帐号没有使用权限";
      await signOut(auth);
      return;
    }
    user = u;
    $("passphrase").value = "";
    $("unlockMsg").textContent = "";
    show("unlockView");
  });

  // ===== 解锁 =====
  $("unlockBtn").onclick = async () => {
    const pass = $("passphrase").value;
    if (!pass) { $("unlockMsg").textContent = "请输入加密密码"; return; }
    try {
      const snap = await getDoc(doc(db, "vaults", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        salt = unb64(d.salt);
        key = await deriveKey(pass, salt);
        const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(d.iv) }, key, unb64(d.data));
        const p = JSON.parse(dec.decode(pt));
        if (Array.isArray(p)) {
          items = p;
        } else {
          items = p.items || [];
          settings = { ...settings, ...(p.settings || {}), catColors: { ...settings.catColors, ...((p.settings || {}).catColors || {}) } };
        }
      } else {
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await deriveKey(pass, salt);
        items = [];
        await saveVault();
      }
      applyAll();
      show("vaultView");
      render();
    } catch (e) {
      $("unlockMsg").textContent = "解锁失败：加密密码不正确，或资料损坏";
    }
  };

  $("passphrase").addEventListener("keydown", e => { if (e.key === "Enter") $("unlockBtn").click(); });

  // ===== 登出 =====
  $("logoutBtn").onclick = async () => {
    await signOut(auth);
    toast("已登出");
  };

  // ===== 外观设定 =====
  function applyAll() {
    applyBg();
    applyFont();
    applyHeader();
  }

  function applyBg() {
    const c = settings.bg || "#fafafa";
    document.body.style.background = c;
    $("bgColor").value = c;
  }

  function applyFont() {
    const f = settings.font || "m";
    document.body.style.zoom = ZOOM[f];
    $("fontSize").value = f;
  }

  function applyHeader() {
    const c = settings.header || "#7c8db5";
    $("hdr").style.background = c;
    $("hdColor").value = c;
  }

  $("bgColor").addEventListener("change", async e => {
    settings.bg = e.target.value;
    applyBg();
    await persist("背景已储存");
  });

  $("hdColor").addEventListener("change", async e => {
    settings.header = e.target.value;
    applyHeader();
    await persist("标题列颜色已储存");
  });

  $("fontSize").addEventListener("change", async e => {
    settings.font = e.target.value;
    applyFont();
    await persist("字体已储存");
  });

  // ===== 搜寻 =====
  $("search").addEventListener("input", render);

  // ===== 备份与还原 =====
  $("backupBtn").onclick = async () => {
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify({ items, settings })));
      const payload = { format: "vault-backup-v1", salt: b64(salt), iv: b64(iv), data: b64(ct) };
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "网站清单备份-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("备份已下载（请妥善保管）");
    } catch (e) {
      toast("备份失败：" + e.message);
    }
  };

  $("restoreFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const pass = prompt("请输入这份备份当时使用的加密密码：");
    if (!pass) return;
    try {
      const d = JSON.parse(await file.text());
      const k = await deriveKey(pass, unb64(d.salt));
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(d.iv) }, k, unb64(d.data));
      const p = JSON.parse(dec.decode(pt));
      if (!confirm("还原会覆盖目前的清单，确定要还原吗？")) return;
      items = p.items || [];
      settings = { ...settings, ...(p.settings || {}) };
      applyAll();
      await persist("已还原");
      render();
    } catch (err) {
      toast("还原失败：密码不正确或档案已损坏");
    }
  });

  // ===== 复制 =====
  async function copy(text) {
    await navigator.clipboard.writeText(text);
    toast("已复制");
  }

  // ===== 排序 =====
  async function moveBefore(fromId, toId) {
    const from = items.find(x => x.id === fromId);
    const to = items.find(x => x.id === toId);
    if (!from || !to || from === to) return;
    items = items.filter(x => x.id !== fromId);
    from.category = to.category || "";
    const idx = items.findIndex(x => x.id === toId);
    items.splice(idx, 0, from);
    await persist();
    render();
  }

  async function moveStep(id, dir) {
    const i = items.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    await persist();
    render();
  }

  // ===== 分类侧栏 =====
  function catOf(it) { return it.category || NOCAT; }
  function catColor(c) { return (settings.catColors || {})[c] || "#ffffff"; }

  function renderSidebar() {
    const box = $("catList");
    box.textContent = "";
    const counts = new Map();
    items.forEach(it => counts.set(catOf(it), (counts.get(catOf(it)) || 0) + 1));

    const addBtn = (label, count, value, color) => {
      const b = document.createElement("button");
      b.className = "cat-item" + (activeCat === value ? " on" : "");
      const left = document.createElement("span");
      if (color) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = color;
        left.appendChild(dot);
      }
      left.appendChild(document.createTextNode(label));
      const right = document.createElement("span");
      right.className = "muted";
      right.style.margin = "0";
      right.textContent = count;
      b.appendChild(left);
      b.appendChild(right);
      b.onclick = () => { activeCat = value; render(); };
      box.appendChild(b);
    };

    addBtn("全部", items.length, null, null);
    counts.forEach((n, c) => addBtn(c, n, c, catColor(c)));
  }

  // ===== 主画面 =====
  function render() {
    renderSidebar();
    const panels = $("panels");
    panels.textContent = "";

    if (!items.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "还没有网站，按「新增网站」开始。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const q = $("search").value.trim().toLowerCase();
    const searching = q !== "";
    const visible = items.filter(it =>
      (!activeCat || catOf(it) === activeCat) &&
      (!searching || [it.name, it.url, it.username, it.note || "", it.category || ""].some(s => s.toLowerCase().includes(q)))
    );

    if (!visible.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "找不到符合的网站。";
      panels.appendChild(p);
      renderCatOptions();
      return;
    }

    const groups = new Map();
    visible.forEach(it => {
      const c = catOf(it);
      if (!groups.has(c)) groups.set(c, []);
      groups.get(c).push(it);
    });

    groups.forEach((arr, cat) => panels.appendChild(catPanel(cat, arr, !searching)));
    renderCatOptions();
  }

  function catPanel(cat, arr, canReorder) {
    const p = document.createElement("div");
    p.className = "panel-cat";
    p.style.background = catColor(cat);

    const ph = document.createElement("div");
    ph.className = "ph";
    const title = document.createElement("strong");
    title.textContent = cat + "（" + arr.length + "）";
    const pick = document.createElement("input");
    pick.type = "color";
    pick.value = catColor(cat);
    pick.title = "分类面板颜色";
    pick.addEventListener("change", async e => {
      settings.catColors = { ...(settings.catColors || {}), [cat]: e.target.value };
      await persist("分类颜色已储存");
      render();
    });
    ph.appendChild(title);
    ph.appendChild(pick);
    p.appendChild(ph);

    const grid = document.createElement("div");
    grid.className = "items";
    arr.forEach(it => grid.appendChild(itemRow(it, canReorder)));
    p.appendChild(grid);
    return p;
  }

  function tbtn(text, fn, extra = "") {
    const b = document.createElement("button");
    b.textContent = text;
    b.className = "tbtn " + extra;
    b.onclick = fn;
    return b;
  }

  function itemRow(it, canReorder) {
    const row = document.createElement("div");
    row.className = "item";
    row.style.background = it.color || PRESETS[0];

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("strong");
    name.textContent = it.name;
    info.appendChild(name);
    const acc = document.createElement("div");
    acc.className = "muted";
    acc.textContent = "帐号：" + it.username;
    info.appendChild(acc);
    if (it.note) {
      const n = document.createElement("div");
      n.className = "muted";
      n.textContent = it.note;
      info.appendChild(n);
    }
    row.appendChild(info);

    const btns = document.createElement("div");
    btns.className = "btns";
    btns.appendChild(tbtn("开启", () => window.open(it.url, "_blank", "noopener")));
    btns.appendChild(tbtn("复制帐号", () => copy(it.username)));
    btns.appendChild(tbtn("复制密码", () => copy(it.password)));
    btns.appendChild(tbtn("编辑", () => openEditor(it)));
    btns.appendChild(tbtn("删除", () => removeItem(it.id), "red"));
    if (canReorder) {
      btns.appendChild(tbtn("↑", () => moveStep(it.id, -1), "gray"));
      btns.appendChild(tbtn("↓", () => moveStep(it.id, 1), "gray"));
    }
    row.appendChild(btns);

    if (canReorder) {
      row.draggable = true;
      row.addEventListener("dragstart", e => {
        dragId = it.id;
        e.dataTransfer.effectAllowed = "move";
        row.style.opacity = "0.5";
      });
      row.addEventListener("dragend", () => {
        dragId = null;
        row.style.opacity = "1";
      });
      row.addEventListener("dragover", e => {
        e.preventDefault();
        row.classList.add("over");
      });
      row.addEventListener("dragleave", () => row.classList.remove("over"));
      row.addEventListener("drop", e => {
        e.preventDefault();
        row.classList.remove("over");
        if (dragId) moveBefore(dragId, it.id);
      });
    }
    return row;
  }

  function renderCatOptions() {
    const dl = $("catOptions");
    dl.textContent = "";
    [...new Set(items.map(x => x.category).filter(Boolean))].forEach(c => {
      const o = document.createElement("option");
      o.value = c;
      dl.appendChild(o);
    });
  }

  $("openAllBtn").onclick = () => {
    items.forEach(it => window.open(it.url, "_blank", "noopener"));
  };

  // ===== 颜色选择 =====
  function setColor(c) {
    $("eColor").value = c;
    if (document.activeElement !== $("eHex")) $("eHex").value = c.toUpperCase();
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s.dataset.color.toLowerCase() === c.toLowerCase()));
  }

  function buildSwatches() {
    const box = $("swatches");
    box.textContent = "";
    PRESETS.forEach(c => {
      const s = document.createElement("button");
      s.className = "swatch";
      s.dataset.color = c;
      s.style.background = c;
      s.title = c;
      s.onclick = e => { e.preventDefault(); setColor(c); };
      box.appendChild(s);
    });
  }

  $("eColor").addEventListener("input", e => setColor(e.target.value));

  $("eHex").addEventListener("input", e => {
    let v = e.target.value.trim();
    if (v && !v.startsWith("#")) v = "#" + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      $("editMsg").textContent = "";
      setColor(v);
    } else if (v.length >= 7) {
      $("editMsg").textContent = "色码格式不正确，要 6 位数，例如 #215487";
    }
  });

  // ===== 编辑 =====
  function openEditor(it = null) {
    editingId = it ? it.id : null;
    $("eName").value = it ? it.name : "";
    $("eCat").value = it ? (it.category || "") : (activeCat && activeCat !== NOCAT ? activeCat : "");
    $("eUrl").value = it ? it.url : "";
    $("eUser").value = it ? it.username : "";
    $("ePass").value = it ? it.password : "";
    $("eNote").value = it ? (it.note || "") : "";
    $("editMsg").textContent = "";
    renderCatOptions();
    buildSwatches();
    setColor(it && it.color ? it.color : PRESETS[0]);
    $("editor").classList.remove("hidden");
    $("editor").scrollIntoView({ behavior: "smooth" });
  }

  function closeEditor() {
    $("editor").classList.add("hidden");
    editingId = null;
  }

  $("addBtn").onclick = () => openEditor();
  $("cancelBtn").onclick = closeEditor;

  $("saveBtn").onclick = async () => {
    const data = {
      name: $("eName").value.trim(),
      category: $("eCat").value.trim(),
      url: $("eUrl").value.trim(),
      username: $("eUser").value,
      password: $("ePass").value,
      note: $("eNote").value.trim(),
      color: $("eColor").value
    };
    if (!data.name) { $("editMsg").textContent = "请输入名称"; return; }
    if (!/^https?:\/\//.test(data.url)) { $("editMsg").textContent = "网址要以 https:// 开头"; return; }

    if (editingId) {
      items = items.map(x => (x.id === editingId ? { ...x, ...data } : x));
    } else {
      items.push({ id: crypto.randomUUID(), ...data });
    }
    try {
      await saveVault();
      closeEditor();
      render();
      toast("已储存");
    } catch (e) {
      $("editMsg").textContent = "储存失败：" + e.message;
    }
  };

  async function removeItem(id) {
    if (!confirm("确定要删除这个网站吗？")) return;
    items = items.filter(x => x.id !== id);
    await persist();
    render();
  }
</script>
</body>
</html>
